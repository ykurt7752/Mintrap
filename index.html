function previousDay(key){const [y,m,d]=key.split('-').map(Number);const value=new Date(Date.UTC(y,m-1,d-1));return value.toISOString().slice(0,10);}
function makeDaily(key){
 const n=6,masks=[3,6,12,24,48,32],combinations=[];
 for(let bits=1;bits<64;bits++){const indices=[];for(let i=0;i<6;i++)if(bits&(1<<i))indices.push(i);if(indices.length>=3&&indices.length<=5)combinations.push(indices);}
 const [year,month,day]=key.split('-').map(Number);
 const ordinal=Math.floor(Date.UTC(year,month-1,day)/86400000);
 const solution=combinations[((ordinal*17)%combinations.length+combinations.length)%combinations.length];
 let start=63;for(const i of solution)start^=masks[i];
 return {type:'light',title:pair('Günün Devresi','Circuit of the Day'),n,start,masks,solution,max:solution.length,date:key,hints:[pair('Sol uçtan başlayıp ışıkların bağlantılarını takip et.','Start at the left and follow the connections.'),pair('İlk gerekli anahtar: '+(solution[0]+1)+'.','The first required switch is '+(solution[0]+1)+'.')],why:pair('Bir anahtarın iki kez kullanılması birbirini iptal eder. Gerekli anahtarları bul; sıranın önemi yok.','Using a switch twice cancels its effect. Find the required switches; their order does not matter.')};
}
function active(){return current==='daily'?activeDaily:levels[current];}
function kind(l){return t(l.type);}
function difficulty(i){return i<3?t('warm'):i<6?t('medium'):i<10?t('hard'):t('deep');}
function checkRule(p,r){if(r[0]==='before')return p.indexOf(r[1])<p.indexOf(r[2]);if(r[0]==='offset')return p.indexOf(r[2])-p.indexOf(r[1])===r[3];return p.indexOf(r[1])===r[2]-1;}
function clue(r){if(r[0]==='before')return lang==='tr'?`${r[1]}, ${r[2]}’den önce.`:`${r[1]} is before ${r[2]}.`;if(r[0]==='pos')return lang==='tr'?`${r[1]}, ${r[2]}. sırada.`:`${r[1]} is in position ${r[2]}.`;return lang==='tr'?`${r[2]}, ${r[1]}’${r[1]==='A'?'dan':'den'} ${r[3]===1?'hemen sonra':r[3]+' sıra sonra (arada '+(r[3]-1)+' kart)'}.`:`${r[2]} is ${r[3]===1?'immediately after '+r[1]:r[3]+' positions after '+r[1]+' ('+(r[3]-1)+' card in between)'}.`;}

function start(i){current=i;screen='game';if(i==='daily')activeDaily=makeDaily(dateKey());const l=active();state={value:l.start,cards:[],history:[]};hints=0;reveal=false;won=false;notice='';noticeKind='';renderGame();}
function moveCount(){return state.history.length;}
function win(){won=true;notice='success';noticeKind='good';if(current==='daily'){const key=activeDaily.date;if(!dailyDone[key]){dailyDone[key]=true;if(!lastDaily||key>lastDaily){streak=lastDaily===previousDay(key)?streak+1:1;lastDaily=key;}}}else if(!completed.includes(current))completed.push(current);persist();}
function reached(){const l=active();return state.value===(l.type==='light'?(1<<l.n)-1:l.target);}
function solutionHtml(l){if(l.type==='order')return [...l.answer].join(' → ');if(l.type==='light')return l.solution.map(i=>`${t('switch')} ${i+1}`).join(' → ');let v=l.start;return String(v)+l.solution.map(i=>{v=l.ops[i][1](v);return ' → '+l.ops[i][0]+' → '+v;}).join('');}
function renderGame(){const l=active(),limit=won||moveCount()>=l.max;let board='';

else if(l.type==='number'){board=`<div class="board"><div class="target">${t('target')} ${l.target}</div><div class="number">${state.value}</div><div class="operations">${l.ops.map((op,i)=>`<button data-action="operation" data-index="${i}" ${limit?'disabled':''}>${op[0]}</button>`).join('')}</div><div class="history">${t('move')} ${moveCount()} / ${l.max}<br>${l.start}${state.history.map(h=>' → '+l.ops[h.index][0]+' → '+h.after).join('')}</div></div>`;}
else{board=`<ul class="clues">${l.rules.map(r=>'<li>'+clue(r)+'</li>').join('')}</ul><div class="board"><div class="slots">${[...l.items].map((_,i)=>`<div><button class="slot" data-action="remove" data-index="${i}" ${won||!state.cards[i]?'disabled':''} aria-label="${state.cards[i]?t('remove')+' '+state.cards[i]:t('empty')}">${state.cards[i]||'·'}</button><small>${i+1}</small></div>`).join('')}</div><div class="pool">${[...l.items].map(c=>`<button data-action="card" data-card="${c}" ${won||state.cards.includes(c)?'disabled':''}>${c}</button>`).join('')}</div></div><button class="primary full" data-action="check" ${won||state.cards.length!==l.items.length?'disabled':''}>${t('check')}</button>`;}
app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="home">← ${t('back')}</button><small>${current==='daily'?t('daily')+' · '+l.date:t('level')+' '+(current+1)+' / 20'}</small></div><div class="progress"><div style="width:${current==='daily'?100:(current+1)*5}%"></div></div><div class="eyebrow">${current==='daily'?t('daily'):difficulty(current)} · ${kind(l)}</div><h2>${text(l.title)}</h2><p class="rule">${t(l.type+'Rule')}</p>${l.type==='order'?'':`<div class="tags"><span>${t('max')}: ${l.max}</span><span>${t('start')}: ${l.type==='number'?l.start:Array.from({length:l.n},(_,i)=>l.start&(1<<i)?i+1:null).filter(Boolean).join(', ')||'—'}</span></div>`}${board}<div class="status ${noticeKind}" role="status" aria-live="polite">${t(notice||'ready')}</div><div class="actions"><button data-action="undo" ${won||!state.history.length?'disabled':''}>↶ ${t('undo')}</button><button data-action="reset">↻ ${t('reset')}</button><button data-action="hint" ${hints>=l.hints.length?'disabled':''}>${t('hint')} ${hints}/${l.hints.length}</button></div>${l.hints.slice(0,hints).map((h,i)=>`<div class="hint"><strong>${t('hint')} ${i+1}</strong><br>${text(h)}</div>`).join('')}${won||reveal?`<div class="solution"><strong>${t(won?'logic':'sample')}</strong><p>${solutionHtml(l)}</p>${text(l.why)}${won?'':'<p>'+t('spoilerNote')+'</p>'}</div>`:`<button class="secondary full" data-action="reveal">${t('reveal')}</button>`}${won?`<button class="primary full" data-action="${current==='daily'?'home':current===19?'finish':'next'}">${t(current==='daily'?'back':current===19?'finish':'next')} →</button>`:''}${current==='daily'&&l.date!==dateKey()?`<p class="warning">${t('midnight')}</p>`:''}${storageNote()}`;}

function act(action,index,card,chosenLang){
if(action==='lang'){lang=chosenLang==='en'?'en':'tr';persist();redraw();return;}
if(action==='rules'){screen='rules';renderRules();return;}if(action==='ruleOpen'){if(Number.isInteger(index)&&index>=0&&index<ruleLevels.length)startRule(index);return;}if(action==='rulePick'){pickRule(index);return;}if(action==='ruleHint'){ruleHint=true;renderRuleGame();return;}if(action==='ruleReset'){startRule(ruleIndex);return;}if(action==='ruleNext'){if(ruleIndex<ruleLevels.length-1)startRule(ruleIndex+1);else{screen='rules';renderRules();}return;}if(action==='home'){home();return;}if(action==='daily'){start('daily');return;}
if(action==='continue'){const next=levels.findIndex((_,i)=>!completed.includes(i));start(next<0?0:next);return;}
if(action==='open'){if(Number.isInteger(index)&&index>=0&&index<20)start(index);return;}
if(!state)return;const l=active();
if(action==='reset'){start(current);return;}if(action==='next'){if(current!=='daily'&&current<19)start(current+1);return;}if(action==='finish'){finish();return;}
if(action==='hint'){hints=Math.min(hints+1,l.hints.length);renderGame();return;}if(action==='reveal'){reveal=true;renderGame();return;}if(won)return;
notice='';noticeKind='';
if(action==='undo'){const h=state.history.pop();if(h){if(l.type==='order')state.cards=h.before;else state.value=h.before;}}
else if(action==='card'&&l.type==='order'&&l.items.includes(card)&&!state.cards.includes(card)){state.history.push({before:[...state.cards]});state.cards.push(card);}
else if(action==='remove'&&l.type==='order'&&state.cards[index]){state.history.push({before:[...state.cards]});state.cards.splice(index,1);}
else if(action==='check'&&l.type==='order'&&state.cards.length===l.items.length){if(l.rules.every(r=>checkRule(state.cards,r)))win();else{notice='wrong';noticeKind='warning';}}
else if((action==='switch'&&l.type==='light')||(action==='operation'&&l.type==='number')){const options=l.masks||l.ops;if(moveCount()>=l.max||!Number.isInteger(index)||index<0||index>=options.length)return;const before=state.value;state.value=l.type==='light'?before^l.masks[index]:l.ops[index][1](before);state.history.push({index,before,after:state.value});if(reached())win();else if(moveCount()===l.max){notice='limit';noticeKind='warning';}}
renderGame();}

const ruleLevels=[];
function rule(tr,en,htr,hen,test){ruleLevels.push({why:pair(tr,en),hint:pair(htr,hen),test});}
rule('En büyük şekli seç.','Choose the largest shape.','Boyutları karşılaştır.','Compare sizes.',(s,a)=>s.size===Math.max(...a.map(x=>x.size)));
rule('Köşesi olmayan şekli seç.','Choose the shape with no corners.','Kenar çizgisini izle.','Follow the outline.',s=>s.kind==='circle');
rule('İçi boş şekli seç.','Choose the hollow shape.','Şeklin içine bak.','Look inside.',s=>!s.fill);
rule('Üç köşeli şekli seç.','Choose the three-cornered shape.','Köşeleri say.','Count corners.',s=>s.kind==='triangle');
rule('En küçük şekli seç.','Choose the smallest shape.','Büyük olmak her zaman avantaj değil.','Bigger is not always better.',(s,a)=>s.size===Math.min(...a.map(x=>x.size)));
rule('Tek başına farklı renkte olan şekli seç.','Choose the only shape with a different color.','Üç şeklin ortak özelliği ne?','What do three shapes share?',(s,a)=>a.filter(x=>x.color===s.color).length===1&&a.some(x=>a.filter(y=>y.color===x.color).length===3));
rule('En çok nokta içeren şekli seç.','Choose the shape with the most dots.','İçerideki işaretleri say.','Count the marks inside.',(s,a)=>s.dots===Math.max(...a.map(x=>x.dots)));
rule('Dört köşeli şekli seç.','Choose the four-cornered shape.','Yönü değişse de köşe sayısı aynı kalır.','Rotation does not change the corner count.',s=>s.kind==='square');
rule('Tam iki nokta içeren şekli seç.','Choose the shape with exactly two dots.','Daha çok, daha iyi demek değil.','More is not always better.',s=>s.dots===2);
rule('Diğer üçünden farklı biçimdeki şekli seç.','Choose the shape unlike the other three.','Rengi ve boyutu bir kenara bırak.','Set color and size aside.',(s,a)=>a.filter(x=>x.kind===s.kind).length===1&&a.some(x=>a.filter(y=>y.kind===x.kind).length===3));
rule('İçi dolu daireyi seç.','Choose the filled circle.','İki özelliği birlikte kontrol et.','Check two features together.',s=>s.kind==='circle'&&s.fill);
rule('İçi boş üçgeni seç.','Choose the hollow triangle.','Hem dış çizgi hem iç alan önemli.','Both outline and interior matter.',s=>s.kind==='triangle'&&!s.fill);
rule('Nokta sayısı köşe sayısına eşit olan şekli seç.','Choose the shape whose dots match its corners.','İçeriyi dışarıyla karşılaştır.','Compare inside with outside.',s=>s.dots===({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi dolu şekiller arasından en küçüğünü seç.','Choose the smallest filled shape.','Önce içi boş şekilleri ele.','First exclude hollow shapes.',(s,a)=>s.fill&&s.size===Math.min(...a.filter(x=>x.fill).map(x=>x.size)));
rule('Tek sayıda nokta içeren şekli seç.','Choose the shape with an odd number of dots.','Noktaları ikişer eşleştir.','Pair up the dots.',s=>s.dots%2===1);
rule('İçi boş şekiller arasından en büyüğünü seç.','Choose the largest hollow shape.','Önce dolu şekilleri ele.','First exclude filled shapes.',(s,a)=>!s.fill&&s.size===Math.max(...a.filter(x=>!x.fill).map(x=>x.size)));
rule('İkinci en büyük şekli seç.','Choose the second largest shape.','Boyutları sırala; ilkini atla.','Sort by size; skip the first.',(s,a)=>s.size===[...a].sort((x,y)=>y.size-x.size)[1].size);
rule('Noktası olmayan, içi dolu şekli seç.','Choose the filled shape with no dots.','İç alanın rengi ve işaretleri birlikte önemli.','Interior color and marks both matter.',s=>s.fill&&s.dots===0);
rule('Nokta sayısı köşe sayısından fazla olan şekli seç.','Choose the shape with more dots than corners.','İki sayıyı karşılaştır.','Compare two counts.',s=>s.dots>({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi boş, çift sayıda nokta içeren şekli seç. Sıfır da çifttir.','Choose the hollow shape with an even number of dots. Zero is even.','İki koşul var: dolgu ve sayı çiftliği.','Two conditions: fill and evenness.',s=>!s.fill&&s.dots%2===0);

rule('Üç şekil doluysa boş olanı, üçü boşsa dolu olanı seç.','Choose the only shape with different fill.','Çoğunluğun tersini ara.','Look for the opposite of the majority.',(s,a)=>a.filter(x=>x.fill===s.fill).length===1);
rule('İkinci en küçük şekli seç.','Choose the second smallest shape.','En küçüğe aldanma; bir sıra yukarı çık.','Do not pick the smallest; move up one rank.',(s,a)=>s.size===[...a].sort((x,y)=>x.size-y.size)[1].size);
rule('Nokta sayısı diğer üçünden farklı olan şekli seç.','Choose the shape with a different dot count from the other three.','Noktaları tek tek değil, gruplar arasında karşılaştır.','Compare dot counts across the group.',(s,a)=>a.filter(x=>x.dots===s.dots).length===1&&a.some(x=>a.filter(y=>y.dots===x.dots).length===3));
rule('En az noktaya sahip dolu şekli seç.','Choose the filled shape with the fewest dots.','Önce dolgu, sonra sayı.','First fill, then count.',(s,a)=>s.fill&&s.dots===Math.min(...a.filter(x=>x.fill).map(x=>x.dots)));
rule('Köşe sayısı nokta sayısından bir fazla olan şekli seç.','Choose the shape with one more corner than dots.','Eşitlik arama; fark bir.','Look for a difference of one.',s=>({circle:0,triangle:3,square:4,pentagon:5})[s.kind]===s.dots+1);
rule('En büyük şekille aynı sayıda nokta içeren diğer şekli seç.','Choose the other shape with as many dots as the largest shape.','En büyük şekil cevap değil, referans.','The largest shape is a reference.',(s,a)=>s.size!==Math.max(...a.map(x=>x.size))&&s.dots===a.find(x=>x.size===Math.max(...a.map(y=>y.size))).dots);
rule('En küçük şekille aynı renkte olan diğer şekli seç.','Choose the other shape with the same color as the smallest shape.','Küçük şekli bul, sonra renk eşini ara.','Find the smallest, then its color partner.',(s,a)=>s.size!==Math.min(...a.map(x=>x.size))&&s.color===a.find(x=>x.size===Math.min(...a.map(y=>y.size))).color);
rule('Nokta sayısı farklıysa en çok noktalıyı; eşitse en büyüğü seç.','Choose the most dots; break a tie by choosing the largest.','İki şekil eşitse boyut karar verir.','Size breaks a tie.',(s,a)=>s.dots===Math.max(...a.map(x=>x.dots))&&s.size===Math.max(...a.filter(x=>x.dots===s.dots).map(x=>x.size)));
rule('Nokta sayısı köşe sayısının yarısı olan şekli seç.','Choose the shape with half as many dots as corners.','Köşeleri ikişer eşleştir.','Pair up the corners.',s=>s.dots*2===({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('En büyük ve en küçük şekli ele; kalan iki şekilden daha çok noktalıyı seç.','Discard the largest and smallest; choose more dots among the remaining two.','Uçları ele, ortadakileri karşılaştır.','Remove the extremes, compare the middle.',(s,a)=>{const mid=[...a].sort((x,y)=>x.size-y.size).slice(1,3);return mid.includes(s)&&s.dots===Math.max(...mid.map(x=>x.dots));});

function generateChoices(level,round){
 // Seeded rounds reproduce the same puzzle on restart without revealing the rule.
 let seed=(level+1)*98731+(round+1)*1237;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const int=n=>Math.floor(rand()*n);
 for(let attempt=0;attempt<10000;attempt++){
  const sizes=[38,52,66,80];for(let j=3;j>0;j--){const k=int(j+1);[sizes[j],sizes[k]]=[sizes[k],sizes[j]];}
  const a=sizes.map(size=>({size,kind:['circle','triangle','square','pentagon'][int(4)],color:int(4),fill:!!int(2),dots:int(6)}));
  if([0,4,13,15,16,21,25,26,27,29].includes(level)){const sameKind=a[0].kind;a.forEach(x=>x.kind=sameKind);}

function startFriendRound(){friendRun.name=cleanName(document.getElementById('friend-player-name')?.value)||friendRun.name||ft('Oyuncu','Player');saveFriends();if(friendRun.scores.length===5){renderFriendResult();return;}const ids=friendIds(friendRun.seed,friendRun.difficulty);startRule(ids[friendRun.scores.length]);}

function renderFriendResult(){screen='friendResult';state=null;const me=friendScoresTotal(friendRun.scores),op=friendOpponent?friendScoresTotal(friendOpponent.scores):null;const verdict=!op?ft('Arkadaşının sonuç bağlantısını açtığında karşılaştırma burada görünecek.','Open your friend’s result link to see the comparison here.'):me.stars>op.stars||me.stars===op.stars&&me.attempts<op.attempts?ft('Bu meydan okumayı kazandın!','You won this challenge!'):me.stars===op.stars&&me.attempts===op.attempts?ft('Berabere!','A tie!'):ft('Bu meydan okumada arkadaşın önde!','Your friend leads this challenge!');app.innerHTML=header()+`<button class="secondary" data-action="friends">← ${friendTitle()}</button><section class="card hero"><div class="eyebrow">5 / 5 ${t('done')}</div><h1>${ft('Meydan okuma tamam!','Challenge complete!')}</h1><h2>${escapeMarkup(friendRun.name)}</h2><p class="stars">${friendStats(friendRun.scores)}</p><p class="good" role="status">${verdict}</p>${friendOpponent?`<div class="hint"><strong>${escapeMarkup(friendOpponent.name)}</strong><p>${friendStats(friendOpponent.scores)}</p></div>`:''}<table class="friend-table"><thead><tr><th>${t('level')}</th><th>${escapeMarkup(friendRun.name)}</th>${friendOpponent?`<th>${escapeMarkup(friendOpponent.name)}</th>`:''}</tr></thead><tbody>${friendRun.scores.map((r,i)=>`<tr><td>${i+1}</td><td>${starsText(r.stars)}<br><small>${r.attempts} ${ft('deneme','attempts')}</small></td>${friendOpponent?`<td>${starsText(friendOpponent.scores[i].stars)}<br><small>${friendOpponent.scores[i].attempts} ${ft('deneme','attempts')}</small></td>`:''}</tr>`).join('')}</tbody></table>${friendShareBox(true)}<p class="rule-note">${ft('Sonuç bağlantın bu 5 bulmacanın sonuçlarını taşır. Arkadaşın kendi oyununu tamamladığında karşılaştırabilir.','Your result link carries the scores for these 5 puzzles. Your friend can compare after completing their own run.')}</p><button class="full" data-action="friends">${ft('Yeni meydan okuma','New challenge')} →</button></section>${storageNote()}`;}
async function shareFriend(result){const url=friendUrl(result);if(!url){friendNotice=ft('Paylaşmak için oyunu canlı GitHub bağlantısından aç.','Open the game from its live GitHub link to share.');redraw();return;}try{if(navigator.share){await navigator.share({title:'MindTrap · Challenge Friends',text:result?ft('5 bulmacayı bitirdim. Sonucumu geçebilir misin?','I solved all 5. Can you beat my result?'):ft('Benimle aynı 5 bulmacayı çöz!','Play the same 5 puzzles with me!'),url});friendNotice=ft('Paylaşım tamamlandı.','Shared.');}else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);friendNotice=ft('Bağlantı kopyalandı. Arkadaşına gönderebilirsin.','Link copied. Send it to a friend.');}else{friendLink=url;friendNotice=ft('Aşağıdaki bağlantıyı seçip kopyala.','Select and copy the link below.');}}catch(e){if(e.name==='AbortError')return;friendLink=url;friendNotice=ft('Aşağıdaki bağlantıyı seçip kopyala.','Select and copy the link below.');}redraw();}
function openFriendChallenge(){try{const q=new URLSearchParams(location.hash.slice(1));if(q.get('mt')!=='05'||q.get('mode')!=='friends')return false;const rawSeed=q.get('seed')||'',seed=Number(rawSeed),difficulty=q.get('pack');if(!/^\d{1,10}$/.test(rawSeed)||!Number.isInteger(seed)||seed<1||seed>1000000000||!['warm','mix','twist'].includes(difficulty))return true;let scores=null;const raw=q.get('score');if(raw!==null){if(!/^[1-3]\.(?:[3-9]|1[0-2])(?:,[1-3]\.(?:[3-9]|1[0-2])){4}$/.test(raw))return true;scores=raw.split(',').map(v=>{const [stars,attempts]=v.split('.').map(Number);return{stars,attempts};});}
 const from=cleanName(q.get('from'))||ft('Arkadaşın','Your friend');const run={seed,difficulty,name:'',scores:[]};const existing=friendSessions[friendKey(run)];friendRun=existing?{...existing,scores:[...existing.scores]}:run;friendOpponent=scores?{name:from,scores}:null;friendHost=from;friendNotice='';friendLink='';challenge=null;if(friendRun.scores.length===5&&friendOpponent)renderFriendResult();else renderFriendLobby();return true;}catch(e){return false;}}
const originalOpenChallenge=openChallenge;openChallenge=function(){if(openFriendChallenge())return;if(new URLSearchParams(location.hash.slice(1)).get('mt')==='04'){if(friendRun)saveFriends();friendRun=null;friendOpponent=null;}originalOpenChallenge();};
const friendBasePick=pickRule;pickRule=function(i){const wasWon=ruleWon;friendBasePick(i);if(friendRun&&!wasWon&&ruleWon){const ids=friendIds(friendRun.seed,friendRun.difficulty),expected=ids[friendRun.scores.length];if(ruleIndex===expected){friendRun.scores.push(thisScore());saveFriends();renderRuleGame();}}};
const friendBaseExtras=resultExtras;resultExtras=function(){if(!friendRun)return friendBaseExtras();const done=ruleWon;return `<section class="card"><strong>${friendTitle()} · ${Math.min(friendRun.scores.length+(done?0:1),5)} / 5</strong><p>${escapeMarkup(friendRun.name)} · ${friendStats(friendRun.scores)}</p>${done?`<p class="stars">${starsText(thisScore().stars)} · ${ruleAttempts} ${ft('deneme','attempts')}</p>`:''}<button class="full" data-action="friendLobby">${ft('Davete / sonuçlara dön','Back to invite / results')}</button></section>`;};
const friendBaseHome=renderHome;renderHome=function(){friendBaseHome();const section=document.createElement?.('section');const promo=`<section class="card daily"><div class="eyebrow">CHALLENGE FRIENDS</div><h2>${friendTitle()}</h2><p>${ft('Arkadaşını davet et. Aynı 5 bulmacayı çözün, yıldızlarınızı karşılaştırın.','Invite a friend. Solve the same 5 puzzles and compare your stars.')}</p><button class="primary full" data-action="friends">${ft('Arkadaşlarla Oyna','Challenge Friends')} →</button></section>`;if(section){section.innerHTML=promo;app.querySelector('header')?.insertAdjacentElement('afterend',section.firstElementChild);}else app.innerHTML+=promo;};
const friendBaseAct=act;act=function(action,index,card,chosenLang){if(action==='lang'&&screen==='friends'){friendDraftName=cleanName(document.getElementById('friend-name')?.value);friendDraftDifficulty=document.getElementById('friend-difficulty')?.value||friendDraftDifficulty;}if(action==='lang'&&screen==='friendLobby'&&friendRun){friendRun.name=cleanName(document.getElementById('friend-player-name')?.value)||friendRun.name;saveFriends();}if(action==='friends'){if(friendRun)saveFriends();renderFriends();return;}if(action==='friendCreate'){createFriend();return;}if(action==='friendResume'){return;}if(action==='friendLobby'){renderFriendLobby();return;}if(action==='friendPlay'){startFriendRound();return;}if(action==='friendNext'){advanceFriend();return;}if(action==='friendResult'){renderFriendResult();return;}if(action==='friendInvite'||action==='friendShareResult'){friendRun.name=cleanName(document.getElementById('friend-player-name')?.value)||friendRun.name||ft('Oyuncu','Player');saveFriends();shareFriend(action==='friendShareResult');return;}if(friendRun&&['home','rules','daily','continue','open','ruleOpen'].includes(action)){saveFriends();friendRun=null;friendOpponent=null;}if(friendRun&&action==='ruleReset'&&ruleWon){advanceFriend();return;}friendBaseAct(action,index,card,chosenLang);};
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action="friendResume"]');if(!b||b.disabled)return;const r=friendSessions[b.dataset.key];if(!r)return;friendRun={...r,scores:[...r.scores]};friendOpponent=null;friendHost=r.name;friendNotice='';friendLink='';renderFriendLobby();});

redraw();
openChallenge();
</script></body></html>
