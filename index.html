 completed=validIds(saved?saved.completed:old);
 if(saved){lang=saved.lang==='en'?'en':'tr';dailyDone=saved.dailyDone&&typeof saved.dailyDone==='object'&&!Array.isArray(saved.dailyDone)?saved.dailyDone:{};streak=Number.isInteger(saved.streak)&&saved.streak>=0?saved.streak:0;lastDaily=typeof saved.lastDaily==='string'?saved.lastDaily:'';}

function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function previousDay(key){const [y,m,d]=key.split('-').map(Number);const value=new Date(Date.UTC(y,m-1,d-1));return value.toISOString().slice(0,10);}
function makeDaily(key){
 const n=6,masks=[3,6,12,24,48,32],combinations=[];
 for(let bits=1;bits<64;bits++){const indices=[];for(let i=0;i<6;i++)if(bits&(1<<i))indices.push(i);if(indices.length>=3&&indices.length<=5)combinations.push(indices);}
 const [year,month,day]=key.split('-').map(Number);
 const ordinal=Math.floor(Date.UTC(year,month-1,day)/86400000);
 const solution=combinations[((ordinal*17)%combinations.length+combinations.length)%combinations.length];
 let start=63;for(const i of solution)start^=masks[i];
 return {type:'light',title:pair('Günün Devresi','Circuit of the Day'),n,start,masks,solution,max:solution.length,date:key,hints:[pair('Sol uçtan başlayıp ışıkların bağlantılarını takip et.','Start at the left and follow the connections.'),pair('İlk gerekli anahtar: '+(solution[0]+1)+'.','The first required switch is '+(solution[0]+1)+'.')],why:pair('Bir anahtarın iki kez kullanılması birbirini iptal eder. Gerekli anahtarları bul; sıranın önemi yok.','Using a switch twice cancels its effect. Find the required switches; their order does not matter.')};
}
function active(){return current==='daily'?activeDaily:levels[current];}
function kind(l){return t(l.type);}
function difficulty(i){return i<3?t('warm'):i<6?t('medium'):i<10?t('hard'):t('deep');}
function checkRule(p,r){if(r[0]==='before')return p.indexOf(r[1])<p.indexOf(r[2]);if(r[0]==='offset')return p.indexOf(r[2])-p.indexOf(r[1])===r[3];return p.indexOf(r[1])===r[2]-1;}
function clue(r){if(r[0]==='before')return lang==='tr'?`${r[1]}, ${r[2]}’den önce.`:`${r[1]} is before ${r[2]}.`;if(r[0]==='pos')return lang==='tr'?`${r[1]}, ${r[2]}. sırada.`:`${r[1]} is in position ${r[2]}.`;return lang==='tr'?`${r[2]}, ${r[1]}’${r[1]==='A'?'dan':'den'} ${r[3]===1?'hemen sonra':r[3]+' sıra sonra (arada '+(r[3]-1)+' kart)'}.`:`${r[2]} is ${r[3]===1?'immediately after '+r[1]:r[3]+' positions after '+r[1]+' ('+(r[3]-1)+' card in between)'}.`;}
function header(){if(document.body)document.body.dataset.view=screen;return `<header><div><div class="brand"><span>◈</span> MINDTRAP</div><small>${t('subtitle')} · v0.10</small></div><div class="language" aria-label="Language"><button data-action="lang" data-lang="tr" aria-pressed="${lang==='tr'}" class="${lang==='tr'?'selected':''}">TR</button><button data-action="lang" data-lang="en" aria-pressed="${lang==='en'}" class="${lang==='en'?'selected':''}">EN</button></div></header>`;}
function storageNote(){return storageOK?'':`<p class="warning">${t('storageFail')}</p>`;}

<section class="card rule-promo"><div class="eyebrow">${lang==='tr'?'YENİ OYUN MODU':'NEW GAME MODE'}</div><h2>${lang==='tr'?'Kuralı Bul':'Find the Rule'}</h2><p>${lang==='tr'?'Dört şekil, tek gizli kural. Deneyerek keşfet ve üç turda doğrula. 30 bölüm; 10 yeni ters köşe.':'Four shapes, one hidden rule. Experiment, discover and confirm it over three rounds. 30 levels, including 10 new twists.'}</p><button class="primary full" data-action="rules">${lang==='tr'?'Kuralı Bul’u aç':'Open Find the Rule'} →</button></section><section class="card daily"><div class="row"><div class="eyebrow">◷ ${t('daily')}</div><span class="date">${key}</span></div><h2>${isDone?'✓ '+t('todayDone'):text(makeDaily(key).title)}</h2><p>${t('dailyDesc')}</p><div class="row"><small>${t('streak')}: ${lastDaily===key||lastDaily===previousDay(key)?streak:0} ${t('days')}</small><button data-action="daily">${t('dailyPlay')} →</button></div></section>

function start(i){current=i;screen='game';if(i==='daily')activeDaily=makeDaily(dateKey());const l=active();state={value:l.start,cards:[],history:[]};hints=0;reveal=false;won=false;notice='';noticeKind='';renderGame();}
function moveCount(){return state.history.length;}
function win(){won=true;notice='success';noticeKind='good';if(current==='daily'){const key=activeDaily.date;if(!dailyDone[key]){dailyDone[key]=true;if(!lastDaily||key>lastDaily){streak=lastDaily===previousDay(key)?streak+1:1;lastDaily=key;}}}else if(!completed.includes(current))completed.push(current);persist();}
function reached(){const l=active();return state.value===(l.type==='light'?(1<<l.n)-1:l.target);}
function solutionHtml(l){if(l.type==='order')return [...l.answer].join(' → ');if(l.type==='light')return l.solution.map(i=>`${t('switch')} ${i+1}`).join(' → ');let v=l.start;return String(v)+l.solution.map(i=>{v=l.ops[i][1](v);return ' → '+l.ops[i][0]+' → '+v;}).join('');}
function renderGame(){const l=active(),limit=won||moveCount()>=l.max;let board='';
if(l.type==='light'){board=`<div class="board"><div class="lamps">${Array.from({length:l.n},(_,i)=>`<div class="lamp ${state.value&(1<<i)?'on':''}"><div class="bulb">${state.value&(1<<i)?'●':'○'}</div><small>${i+1} · ${state.value&(1<<i)?t('on'):t('off')}</small></div>`).join('')}</div><div class="switches">${l.masks.map((m,i)=>`<button data-action="switch" data-index="${i}" ${limit?'disabled':''}>${t('switch')} ${i+1}<small>↔ ${Array.from({length:l.n},(_,j)=>m&(1<<j)?j+1:null).filter(Boolean).join(' · ')}</small></button>`).join('')}</div><div class="history">${t('move')} ${moveCount()} / ${l.max}${state.history.length?'<br>'+state.history.map(h=>h.index+1).join(' → '):''}</div></div>`;}
else if(l.type==='number'){board=`<div class="board"><div class="target">${t('target')} ${l.target}</div><div class="number">${state.value}</div><div class="operations">${l.ops.map((op,i)=>`<button data-action="operation" data-index="${i}" ${limit?'disabled':''}>${op[0]}</button>`).join('')}</div><div class="history">${t('move')} ${moveCount()} / ${l.max}<br>${l.start}${state.history.map(h=>' → '+l.ops[h.index][0]+' → '+h.after).join('')}</div></div>`;}
else{board=`<ul class="clues">${l.rules.map(r=>'<li>'+clue(r)+'</li>').join('')}</ul><div class="board"><div class="slots">${[...l.items].map((_,i)=>`<div><button class="slot" data-action="remove" data-index="${i}" ${won||!state.cards[i]?'disabled':''} aria-label="${state.cards[i]?t('remove')+' '+state.cards[i]:t('empty')}">${state.cards[i]||'·'}</button><small>${i+1}</small></div>`).join('')}</div><div class="pool">${[...l.items].map(c=>`<button data-action="card" data-card="${c}" ${won||state.cards.includes(c)?'disabled':''}>${c}</button>`).join('')}</div></div><button class="primary full" data-action="check" ${won||state.cards.length!==l.items.length?'disabled':''}>${t('check')}</button>`;}
app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="home">← ${t('back')}</button><small>${current==='daily'?t('daily')+' · '+l.date:t('level')+' '+(current+1)+' / 20'}</small></div><div class="progress"><div style="width:${current==='daily'?100:(current+1)*5}%"></div></div><div class="eyebrow">${current==='daily'?t('daily'):difficulty(current)} · ${kind(l)}</div><h2>${text(l.title)}</h2><p class="rule">${t(l.type+'Rule')}</p>${l.type==='order'?'':`<div class="tags"><span>${t('max')}: ${l.max}</span><span>${t('start')}: ${l.type==='number'?l.start:Array.from({length:l.n},(_,i)=>l.start&(1<<i)?i+1:null).filter(Boolean).join(', ')||'—'}</span></div>`}${board}<div class="status ${noticeKind}" role="status" aria-live="polite">${t(notice||'ready')}</div><div class="actions"><button data-action="undo" ${won||!state.history.length?'disabled':''}>↶ ${t('undo')}</button><button data-action="reset">↻ ${t('reset')}</button><button data-action="hint" ${hints>=l.hints.length?'disabled':''}>${t('hint')} ${hints}/${l.hints.length}</button></div>${l.hints.slice(0,hints).map((h,i)=>`<div class="hint"><strong>${t('hint')} ${i+1}</strong><br>${text(h)}</div>`).join('')}${won||reveal?`<div class="solution"><strong>${t(won?'logic':'sample')}</strong><p>${solutionHtml(l)}</p>${text(l.why)}${won?'':'<p>'+t('spoilerNote')+'</p>'}</div>`:`<button class="secondary full" data-action="reveal">${t('reveal')}</button>`}${won?`<button class="primary full" data-action="${current==='daily'?'home':current===19?'finish':'next'}">${t(current==='daily'?'back':current===19?'finish':'next')} →</button>`:''}${current==='daily'&&l.date!==dateKey()?`<p class="warning">${t('midnight')}</p>`:''}${storageNote()}`;}
function finish(){screen='finish';state=null;renderFinish();}
function renderFinish(){app.innerHTML=header()+`<section class="card hero"><div class="eyebrow">${completed.length} / 20 ${t('done')}</div><h1>${completed.length===20?t('final'):t('levels')}</h1><p>${t('finalText')}</p><button class="primary full" data-action="home">${t('back')} →</button><button class="full" data-action="daily">${t('daily')} →</button></section>`;}
function redraw(){document.documentElement.lang=lang;document.title='MindTrap — '+t('subtitle');if(screen==='freshHome')renderFreshHome();else if(screen==='freshGame')renderFreshGame();else if(screen==='freshResult')renderFreshResult();else if(screen==='classicHome')renderClassicHome();else if(screen==='triviaHome')renderTriviaHome();else if(screen==='triviaGame')renderTriviaGame();else if(screen==='triviaResult')renderTriviaResult();else if(screen==='memoryHome')renderMemoryHome();else if(screen==='memoryGame')renderMemoryGame();else if(screen==='friends')renderFriends();else if(screen==='friendLobby')renderFriendLobby();else if(screen==='friendResult')renderFriendResult();else if(screen==='rules')renderRules();else if(screen==='ruleGame')renderRuleGame();else if(screen==='home')renderHome();else if(screen==='game')renderGame();else renderFinish();}
function act(action,index,card,chosenLang){
if(action==='lang'){lang=chosenLang==='en'?'en':'tr';persist();redraw();return;}
if(action==='rules'){screen='rules';renderRules();return;}if(action==='ruleOpen'){if(Number.isInteger(index)&&index>=0&&index<ruleLevels.length)startRule(index);return;}if(action==='rulePick'){pickRule(index);return;}if(action==='ruleHint'){ruleHint=true;renderRuleGame();return;}if(action==='ruleReset'){startRule(ruleIndex);return;}if(action==='ruleNext'){if(ruleIndex<ruleLevels.length-1)startRule(ruleIndex+1);else{screen='rules';renderRules();}return;}if(action==='home'){home();return;}if(action==='daily'){start('daily');return;}
if(action==='continue'){const next=levels.findIndex((_,i)=>!completed.includes(i));start(next<0?0:next);return;}
if(action==='open'){if(Number.isInteger(index)&&index>=0&&index<20)start(index);return;}
if(!state)return;const l=active();
if(action==='reset'){start(current);return;}if(action==='next'){if(current!=='daily'&&current<19)start(current+1);return;}if(action==='finish'){finish();return;}
if(action==='hint'){hints=Math.min(hints+1,l.hints.length);renderGame();return;}if(action==='reveal'){reveal=true;renderGame();return;}if(won)return;
notice='';noticeKind='';
if(action==='undo'){const h=state.history.pop();if(h){if(l.type==='order')state.cards=h.before;else state.value=h.before;}}
else if(action==='card'&&l.type==='order'&&l.items.includes(card)&&!state.cards.includes(card)){state.history.push({before:[...state.cards]});state.cards.push(card);}
else if(action==='remove'&&l.type==='order'&&state.cards[index]){state.history.push({before:[...state.cards]});state.cards.splice(index,1);}
else if(action==='check'&&l.type==='order'&&state.cards.length===l.items.length){if(l.rules.every(r=>checkRule(state.cards,r)))win();else{notice='wrong';noticeKind='warning';}}
else if((action==='switch'&&l.type==='light')||(action==='operation'&&l.type==='number')){const options=l.masks||l.ops;if(moveCount()>=l.max||!Number.isInteger(index)||index<0||index>=options.length)return;const before=state.value;state.value=l.type==='light'?before^l.masks[index]:l.ops[index][1](before);state.history.push({index,before,after:state.value});if(reached())win();else if(moveCount()===l.max){notice='limit';noticeKind='warning';}}
renderGame();}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action,Number(b.dataset.index),b.dataset.card,b.dataset.lang);});

const ruleLevels=[];
function rule(tr,en,htr,hen,test){ruleLevels.push({why:pair(tr,en),hint:pair(htr,hen),test});}
rule('En büyük şekli seç.','Choose the largest shape.','Boyutları karşılaştır.','Compare sizes.',(s,a)=>s.size===Math.max(...a.map(x=>x.size)));
rule('Köşesi olmayan şekli seç.','Choose the shape with no corners.','Kenar çizgisini izle.','Follow the outline.',s=>s.kind==='circle');
rule('İçi boş şekli seç.','Choose the hollow shape.','Şeklin içine bak.','Look inside.',s=>!s.fill);
rule('Üç köşeli şekli seç.','Choose the three-cornered shape.','Köşeleri say.','Count corners.',s=>s.kind==='triangle');
rule('En küçük şekli seç.','Choose the smallest shape.','Büyük olmak her zaman avantaj değil.','Bigger is not always better.',(s,a)=>s.size===Math.min(...a.map(x=>x.size)));
rule('Tek başına farklı renkte olan şekli seç.','Choose the only shape with a different color.','Üç şeklin ortak özelliği ne?','What do three shapes share?',(s,a)=>a.filter(x=>x.color===s.color).length===1&&a.some(x=>a.filter(y=>y.color===x.color).length===3));
rule('En çok nokta içeren şekli seç.','Choose the shape with the most dots.','İçerideki işaretleri say.','Count the marks inside.',(s,a)=>s.dots===Math.max(...a.map(x=>x.dots)));
rule('Dört köşeli şekli seç.','Choose the four-cornered shape.','Yönü değişse de köşe sayısı aynı kalır.','Rotation does not change the corner count.',s=>s.kind==='square');
rule('Tam iki nokta içeren şekli seç.','Choose the shape with exactly two dots.','Daha çok, daha iyi demek değil.','More is not always better.',s=>s.dots===2);
rule('Diğer üçünden farklı biçimdeki şekli seç.','Choose the shape unlike the other three.','Rengi ve boyutu bir kenara bırak.','Set color and size aside.',(s,a)=>a.filter(x=>x.kind===s.kind).length===1&&a.some(x=>a.filter(y=>y.kind===x.kind).length===3));
rule('İçi dolu daireyi seç.','Choose the filled circle.','İki özelliği birlikte kontrol et.','Check two features together.',s=>s.kind==='circle'&&s.fill);
rule('İçi boş üçgeni seç.','Choose the hollow triangle.','Hem dış çizgi hem iç alan önemli.','Both outline and interior matter.',s=>s.kind==='triangle'&&!s.fill);
rule('Nokta sayısı köşe sayısına eşit olan şekli seç.','Choose the shape whose dots match its corners.','İçeriyi dışarıyla karşılaştır.','Compare inside with outside.',s=>s.dots===({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi dolu şekiller arasından en küçüğünü seç.','Choose the smallest filled shape.','Önce içi boş şekilleri ele.','First exclude hollow shapes.',(s,a)=>s.fill&&s.size===Math.min(...a.filter(x=>x.fill).map(x=>x.size)));
rule('Tek sayıda nokta içeren şekli seç.','Choose the shape with an odd number of dots.','Noktaları ikişer eşleştir.','Pair up the dots.',s=>s.dots%2===1);
rule('İçi boş şekiller arasından en büyüğünü seç.','Choose the largest hollow shape.','Önce dolu şekilleri ele.','First exclude filled shapes.',(s,a)=>!s.fill&&s.size===Math.max(...a.filter(x=>!x.fill).map(x=>x.size)));

ar('Dolu şekillerde en az noktalıyı seç; eşitlik varsa en büyüğünü.','Choose the fewest dots among filled shapes; break a tie by choosing the largest.','Önce dolgu, sonra nokta, sonra boyut.','First fill, then dots, then size.',(s,a)=>{const g=a.filter(x=>x.fill);const min=Math.min(...g.map(x=>x.dots));return g.length>=2&&s.fill&&s.dots===min&&s.size===Math.max(...g.filter(x=>x.dots===min).map(x=>x.size));},true);

ar('Nokta sayısı boyut sırasından bir fazla olanı seç.','Choose one more dot than size rank.','Küçükten büyüğe sıralama ve bir ekleme.','Rank from smallest and add one.',(s,a)=>s.dots===sizeRank(s,a)+1,true);

ar('Boş ve nokta sayısı gruptaki çift köşeli şekillerin sayısına eşit olanı seç.','Choose hollow, with dots equal to the number of even-cornered shapes.','Daireleri de çift köşeli say.','Count circles as even-cornered.',(s,a)=>!s.fill&&s.dots===a.filter(x=>corners(x)%2===0).length);
ar('Köşe sayısı, kendi noktaları ile grubun en az nokta sayısının toplamı olanı seç.','Choose corners equal to its dots plus the group’s minimum dot count.','Bir yerel, bir grup sayısı gerekiyor.','Use one local count and one group count.',(s,a)=>s.dots>0&&corners(s)===s.dots+Math.min(...a.map(x=>x.dots)));

ar('Köşe sayısı iki kat nokta sayısına, doluysa bir eklenmiş değerine eşit olanı seç.','Choose corners equal to twice the dots, plus one if filled.','Dolgu, denkleme bir ekleyebilir.','Fill may add one to the equation.',s=>corners(s)===2*s.dots+(s.fill?1:0));

ar('Dolu ve tek nokta sayılı şekiller arasında en büyüğünü seç.','Choose the largest filled shape with an odd dot count.','Önce iki koşulla ele, sonra en büyüğü bul.','Filter by two conditions, then find the largest.',(s,a)=>extreme(s,a,x=>x.fill&&x.dots%2===1,'size',true),true);
ar('Boş ve çift nokta sayılı şekiller arasında en küçüğünü seç.','Choose the smallest hollow shape with an even dot count.','Sıfır, çift sayıdır.','Zero is even.',(s,a)=>extreme(s,a,x=>!x.fill&&x.dots%2===0,'size',false),true);
ar('Üç veya beş köşeli şekillerde en az noktalıyı seç; eşitlikte en büyüğünü.','Among three- or five-cornered shapes choose the fewest dots; break ties by largest size.','Köşelerle ele, sonra iki özelliği sırala.','Filter by corners, then rank two features.',(s,a)=>{const g=a.filter(x=>[3,5].includes(corners(x))),min=Math.min(...g.map(x=>x.dots));return g.length>=2&&g.includes(s)&&s.dots===min&&s.size===Math.max(...g.filter(x=>x.dots===min).map(x=>x.size));});
ar('Boş ve nokta sayısı kendi rengindeki şekillerin sayısına eşit olanı seç.','Choose hollow, with dots equal to the number of shapes of its color.','Renk gruplarını say.','Count the color groups.',(s,a)=>!s.fill&&s.dots===a.filter(x=>x.color===s.color).length);
ar('Dolu ve nokta sayısı en çok ile en az nokta sayısının farkı olanı seç.','Choose filled, with dots equal to the difference between the maximum and minimum dot counts.','İki uç sayının farkını al.','Subtract the two extreme counts.',(s,a)=>s.fill&&s.dots===Math.max(...a.map(x=>x.dots))-Math.min(...a.map(x=>x.dots)));

function ruleLabel(){return lang==='tr'?'Kuralı Bul':'Find the Rule';}
const shapeNames={circle:pair('Daire','Circle'),triangle:pair('Üçgen','Triangle'),square:pair('Kare','Square'),pentagon:pair('Beşgen','Pentagon')};
const colorNames=[pair('Turkuaz','Teal'),pair('Mor','Purple'),pair('Sarı','Yellow'),pair('Pembe','Pink')];
const shapeColors=['#81dfc7','#b9a8ff','#ffcf75','#ff8fba'];
function generateChoices(level,round){
 // Seeded rounds reproduce the same puzzle on restart without revealing the rule.
 let seed=(level+1)*98731+(round+1)*1237;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const int=n=>Math.floor(rand()*n);
 for(let attempt=0;attempt<10000;attempt++){
  const sizes=[38,52,66,80];for(let j=3;j>0;j--){const k=int(j+1);[sizes[j],sizes[k]]=[sizes[k],sizes[j]];}
  const a=sizes.map(size=>({size,kind:['circle','triangle','square','pentagon'][int(4)],color:int(4),fill:!!int(2),dots:int(6)}));
  if(ruleLevels[level].sameKind){const k=a[0].kind;a.forEach(x=>x.kind=k);}
  if([0,4,13,15,16,21,25,26,27,29].includes(level)){const sameKind=a[0].kind;a.forEach(x=>x.kind=sameKind);}
  if(level===5||level===9){const field=level===5?'color':'kind';const common=a[0][field];a.forEach(x=>x[field]=common);const k=int(4);a[k][field]=field==='color'?(common+1+int(3))%4:['circle','triangle','square','pentagon'].filter(x=>x!==common)[int(3)];}
  if(level===22){const common=int(6);a.forEach(x=>x.dots=common);a[int(4)].dots=(common+1+int(5))%6;}
  if(level===27){const low=[...a].sort((x,y)=>x.size-y.size);low[0].dots=1;low[1].dots=2;low[2].dots=4;low[3].dots=4;}
  if(level===29&&new Set([...a].sort((x,y)=>x.size-y.size).slice(1,3).map(x=>x.dots)).size!==2)continue;
  if(level===23&&a.filter(x=>x.fill).length<2)continue;
  if([13,15].includes(level)&&a.filter(x=>x.fill===(level===13)).length<2)continue;
  if(level===6&&new Set(a.map(x=>x.dots)).size<3)continue;
  if(ruleLevels[level].test&&a.filter(x=>ruleLevels[level].test(x,a)).length===1)return a;
 }
 throw new Error('Cannot construct rule level '+level);
}
function shapeSvg(s){
 const r=s.size/2,c=shapeColors[s.color];let outline='';
 if(s.kind==='circle')outline=`<circle cx="50" cy="50" r="${r}"/>`;
 else{const n={triangle:3,square:4,pentagon:5}[s.kind],offset=s.kind==='square'?Math.PI/4:-Math.PI/2;const pts=Array.from({length:n},(_,i)=>{const a=offset+i*2*Math.PI/n;return (50+r*Math.cos(a))+','+(50+r*Math.sin(a));}).join(' ');outline=`<polygon points="${pts}"/>`;}
 const dots=Array.from({length:s.dots},(_,i)=>{const a=i*2*Math.PI/s.dots;return `<circle cx="${s.dots===1?50:50+10*Math.cos(a)}" cy="${s.dots===1?50:50+10*Math.sin(a)}" r="3.1" fill="${s.fill?'#101222':'#ffffff'}"/>`;}).join('');
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${s.fill?c:'none'}" stroke="${c}" stroke-width="3" stroke-linejoin="round">${outline}</g>${dots}</svg>`;
}
function renderRules(){screen='rules';app.innerHTML=header()+`<button class="secondary" data-action="home">← ${lang==='tr'?'Ana ekran':'Home'}</button><section class="card hero"><div class="eyebrow">${ruleLevels.length} ${t('levels')}</div><h1>${ruleLabel()}</h1><p>${lang==='tr'?'Her bölümde dört şekilden yalnızca biri gizli kurala uyar. Seçim yap, geri bildirimden öğren ve aynı kuralı üç farklı turda uygula. Kural bölüm boyunca değişmez.':'In each level, only one of four shapes follows a hidden rule. Choose, learn from feedback and apply the same rule in three rounds. The rule stays the same throughout the level.'}</p><p class="rule-note">${lang==='tr'?'Yanlış seçimde can kaybetmezsin. İpucu isteyebilirsin; kural üçüncü doğru seçimden sonra açıklanır.':'Wrong picks cost no lives. Hints are available; the rule is revealed after your third correct pick.'}</p><button class="primary full" data-action="ruleOpen" data-index="${ruleLevels.findIndex((_,i)=>!ruleCompleted.includes(i))<0?0:ruleLevels.findIndex((_,i)=>!ruleCompleted.includes(i))}">${t('continue')} →</button></section><div class="row"><strong>${t('levels')}</strong><small>${ruleCompleted.length} / ${ruleLevels.length} ${t('done')}</small></div><div class="progress"><div style="width:${ruleCompleted.length*100/ruleLevels.length}%"></div></div><div class="level-grid">${ruleLevels.map((_,i)=>`<button class="level-button ${ruleCompleted.includes(i)?'complete':''}" data-action="ruleOpen" data-index="${i}"><span>${ruleCompleted.includes(i)?'✓':'◇'} ${String(i+1).padStart(2,'0')}</span><strong>${lang==='tr'?'Gizli Kural':'Hidden Rule'} ${i+1}</strong><small>${i>=20?(lang==='tr'?'Yeni · Ters Köşe':'New · Twist'):i<5?t('warm'):i<10?t('medium'):t('hard')}</small></button>`).join('')}</div>${storageNote()}`;}
function startRule(i){screen='ruleGame';state=null;ruleIndex=i;ruleRound=0;ruleAttempts=0;ruleHint=false;ruleWon=false;ruleRejected=[];ruleMessage='';ruleChoices=generateChoices(i,0);renderRuleGame();}
function pickRule(i){if(screen!=='ruleGame'||ruleWon||!Number.isInteger(i)||!ruleChoices[i]||ruleRejected.includes(i))return;ruleAttempts++;

function triviaTitle(){return ft('Dünyayı Keşfet','World Quest');}

function shuffleWithSeed(items,seed){const a=[...items];let v=seed>>>0;for(let i=a.length-1;i>0;i--){v=(Math.imul(v,1664525)+1013904223)>>>0;const j=v%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function triviaIds(category,seed){return shuffleWithSeed(triviaQuestions.filter(q=>q.tier===triviaTier&&(category==='mix'||q.category===category)).map(q=>q.id),seed).slice(0,5);}
function saveTrivia(){try{localStorage.setItem('mindtrap-trivia-v07',JSON.stringify(triviaHistory));}catch(e){storageOK=false;}}
function currentTrivia(){return triviaQuestions[triviaRun.ids[triviaRun.index]];}
function loadTriviaQuestion(){triviaAnswered=false;triviaChoices=shuffleWithSeed([0,1,2,3],triviaRun.seed+currentTrivia().id*987+triviaRun.index*37);screen='triviaGame';state=null;renderTriviaGame();}
function startTrivia(category){if(!['cities','countries','world','mix'].includes(category))return;const seed=Math.floor(Math.random()*1000000000)+1;triviaRun={category,seed,ids:triviaIds(category,seed),index:0,answers:[]};loadTriviaQuestion();}
function startFriendTrivia(){triviaRun={category:'mix',seed:friendRun.seed,ids:friendIds(friendRun.seed,'trivia'),index:friendRun.scores.length,answers:[]};loadTriviaQuestion();}
function pickTrivia(i){if(screen!=='triviaGame'||triviaAnswered||!Number.isInteger(i)||i<0||i>3)return;const q=currentTrivia(),correct=triviaChoices[i]===0;triviaAnswered=true;triviaRun.answers.push({id:q.id,chosen:triviaChoices[i],correct});triviaHistory[q.id]={correct:correct||!!triviaHistory[q.id]?.correct};if(correct)recordRun('trivia:'+q.id,3,1);saveTrivia();if(friendRun&&friendRun.difficulty==='trivia'&&friendRun.scores.length===triviaRun.index){friendRun.scores.push({stars:correct?3:0,attempts:1});saveFriends();}renderTriviaGame();}

lp('hard','sets','60 kişilik grupta A kulübü 25, B 24, C 20 kişi. A∩B=10, A∩C=8, B∩C=7; bu kesişimler üç kulüpteki kişileri de içerir. Üçünde birden 3 kişi var. Hiçbir kulüpte olmayan kaç kişi?','Of 60 people, A has 25, B 24 and C 20. Pairwise overlaps, including triple members, are AB=10, AC=8, BC=7. All three share 3. How many are in none?',['13','16','10','21'],'Birleşim 25+24+20−10−8−7+3=47. Dışarıda 60−47=13.','The union is 25+24+20−10−8−7+3=47, leaving 13 outside.',{kind:'value',computed:60-(25+24+20-10-8-7+3),value:13});

expert('deduction','P doğruysa Q; Q doğruysa R; S doğruysa R yanlış. S’nin doğru olduğu biliniyor. Hangileri kesinlikle yanlış?','If P then Q; if Q then R; if S then not R. S is true. Which statements must be false?',[pair('P, Q ve R','P, Q and R'),pair('Yalnız R','Only R'),pair('P ve S','P and S'),pair('Q, R ve S','Q, R and S')],'S, R’yi dışlar. R yanlışsa Q doğru olamaz; Q yanlışsa P doğru olamaz.','S excludes R. A false R rules out Q; a false Q rules out P.',{kind:'implications',value:[false,false,false,true]});
expert('count','5 kişi 5 numaralı koltuğa oturacak. Hiç kimse kendi numaralı koltuğuna oturmayacak. Kaç farklı yerleşim mümkün?','Five people sit in five numbered seats. Nobody may sit in their own numbered seat. How many arrangements are possible?',['44','45','60','24'],'Dahil etme–çıkarma: 120−120+60−20+5−1=44.','Inclusion–exclusion gives 120−120+60−20+5−1=44.',{kind:'derangement',n:5,value:44});

reviseLogic(36,'Yol süreleri: A–B=3, B–D=6, A–C=4, C–D=2, B–C=2. A’dan D’ye en kısa süre kaç?','Road times: A–B=3, B–D=6, A–C=4, C–D=2, B–C=2. What is the shortest time from A to D?',['6','8','9','7'],'A–C–D yolu 4+2=6 sürer.','A–C–D takes 4+2=6.',{kind:'route',edges:[['A','B',3],['B','D',6],['A','C',4],['C','D',2],['B','C',2]],from:'A',to:'D',value:6});
reviseLogic(37,'2 daire + 1 kare=15 kg. 1 daire + 1 kare=9 kg. Daire kaç kg?','2 circles + 1 square=15 kg. 1 circle + 1 square=9 kg. How much does the circle weigh?',['6','3','5','7'],'Denklemleri çıkarınca bir daire 6 kg. Kare 3 kg.','Subtracting the equations gives a 6 kg circle. The square is 3 kg.',{kind:'equation',a:6,b:3,equations:[[2,1,15],[1,1,9]]});
reviseLogic(38,'Dört görev var. B ilk. D, C’den hemen sonra; A, D’den sonra. Tek geçerli sıra ne?','Four tasks: B is first, D immediately follows C, and A follows D. What is the only valid order?',['BCDA','BDCA','BACD','CDAB'],'B ilk, C–D bitişik blok, A ise bu bloktan sonra: BCDA.','B is first; the adjacent C–D block is followed by A: BCDA.',{kind:'order',items:'ABCD',rules:[['pos','B',1],['offset','C','D',1],['before','D','A']],answer:'BCDA'});
reviseLogic(39,'45 kişiden 24’ü resim, 21’i müzik kulübünde; 9’u her ikisinde. Tam bir kulüpte olan kaç kişi?','Of 45 people, 24 are in art, 21 in music and 9 in both. How many belong to exactly one club?',['27','36','18','9'],'Her iki kulüpteki 9 kişi iki kez çıkarılır: 24+21−18=27.','Subtract the 9 shared members twice: 24+21−18=27.',{kind:'exactlyOneClub',sizes:[24,21],both:9,value:27});
reviseLogic(40,'Makine her Latin harfini alfabede bir sonraki harfe çevirip sırayı ters çeviriyor: CAT → UBD. DOG ne olur?','A machine replaces each Latin letter with the next alphabet letter, then reverses the order: CAT → UBD. What does DOG become?',['HPE','EPH','GOD','DOG'],'DOG önce EPH, sonra HPE olur.','DOG first becomes EPH, then HPE.',{kind:'shiftReverse',input:'DOG',value:'HPE'});
reviseLogic(41,'8 kişi, her diğer kişiyle tam bir kez el sıkışıyor. Toplam kaç el sıkışma var?','Eight people each shake hands exactly once with every other person. How many handshakes occur?',['28','56','32','16'],'8×7 her çifti iki kez sayar; 8×7÷2=28.','8×7 counts each pair twice; divide by 2 to get 28.',{kind:'handshakes',n:8,value:28});
reviseLogic(42,'Anahtar A, B veya C’de. A: “B’de değil.” B: “A’da.” C: “A’da değil.” Tam bir etiket doğruysa anahtar nerede?','The key is in A, B or C. A says “Not in B,” B says “In A,” C says “Not in A.” Exactly one label is true. Where is the key?',['B','A','C',pair('Belirlenemez','Cannot determine')],'B konumunda yalnız C doğru olur. A ve C konumlarında ikişer doğru etiket vardır.','Location B makes only C true. Locations A and C each make two labels true.',{kind:'truth',statements:[['neq',1],['eq',0],['neq',0]],locations:3,trueCount:1,solutions:[1]});
reviseLogic(43,'Robot yalnız şarjlıysa ve kartı geçerliyse görev yapabilir. Görevi yaptı. Hangi iki koşul mutlaka birlikte sağlanmıştı?','A robot can perform a task only if charged and holding a valid card. It performed the task. Which two conditions must both have held?',[pair('Şarjlı + geçerli kart','Charged + valid card'),pair('Şarjlı + geçersiz kart','Charged + invalid card'),pair('Şarjsız + geçerli kart','Uncharged + valid card'),pair('Şarjsız + geçersiz kart','Uncharged + invalid card')],'Görev, verilen iki gerekli koşulun da sağlandığını gösterir.','Performing the task establishes both stated necessary conditions.');
reviseLogic(44,'27 paradan biri diğerlerinden hafif. İki kefeli terazide en kötü durumda bulmak için en az kaç tartım gerekir?','One of 27 coins is lighter. What is the minimum number of balance-scale weighings required in the worst case?',['3','2','4','5'],'9’a karşı 9, sonra 3’e karşı 3, sonra 1’e karşı 1 tartılır.','Weigh 9 against 9, then 3 against 3, then 1 against 1.',{kind:'coinWeighing',n:27,value:3});
reviseLogic(45,'Dört kişi köprüyü 1,2,5,8 dakikada geçiyor. Aynı anda en çok iki kişi geçebilir; süre yavaş kişiye eşittir. Fener her geçişte taşınmalı. Hepsini geçirmek için en kısa toplam süre kaç?','Four people cross a bridge in 1,2,5,8 minutes. At most two cross together, taking the slower person’s time. The torch must travel on every crossing. What is the minimum total time?',['15','16','17','18'],'1+2 gider (2), 1 döner (1), 5+8 gider (8), 2 döner (2), 1+2 gider (2): toplam 15.','1+2 cross (2), 1 returns (1), 5+8 cross (8), 2 returns (2), 1+2 cross (2): total 15.',{kind:'bridge',times:[1,2,5,8],value:15});
reviseLogic(46,'3×3 hücreli ızgarada (0,0)’dan (3,3)’e yalnız sağa/aşağı gidilir. (2,1) kesişimi kapalı. Kaç yol kalır?','Move only right/down from (0,0) to (3,3) on a 3×3-cell grid. Intersection (2,1) is blocked. How many routes remain?',['11','8','9','14'],'Toplam 20 yolun 3×3=9’u engelden geçer; 11 yol kalır.','Of 20 total routes, 3×3=9 pass the blocker; 11 remain.',{kind:'grid',w:3,h:3,blocked:[[2,1]],value:11});
reviseLogic(47,'2,4,6,8 rakamlarından üç farklı rakam seçilip küçükten büyüğe yazılacak. Kaç şifre var?','Choose three different digits from 2,4,6,8 and write them in increasing order. How many codes are possible?',['4','6','8','12'],'Şifreler 246,248,268,468. Her üçlü için tek artan sıralama vardır.','The codes are 246,248,268,468. Each triple has one increasing order.',{kind:'ascendingDigits',digits:[2,4,6,8],length:3,value:4});
reviseLogic(48,'Yol süreleri: A–B=4, A–C=2, C–B=1, B–D=3, C–D=8, D–E=4, C–E=12. A’dan E’ye en kısa süre kaç?','Road times: A–B=4, A–C=2, C–B=1, B–D=3, C–D=8, D–E=4, C–E=12. What is the shortest time from A to E?',['10','11','12','14'],'A–C–B–D–E yolu 2+1+3+4=10 sürer.','A–C–B–D–E takes 2+1+3+4=10.',{kind:'route',edges:[['A','B',4],['A','C',2],['C','B',1],['B','D',3],['C','D',8],['D','E',4],['C','E',12]],from:'A',to:'E',value:10});
reviseLogic(49,'2 daire + kare=19. Daire + 2 kare=17. Daire ile karenin değerlerinin çarpımı kaç?','2 circles + square=19. Circle + 2 squares=17. What is the product of the two values?',['35','24','30','42'],'Daire 7 ve kare 5. Çarpımları 35.','The circle is 7 and square 5; their product is 35.',{kind:'equation',a:7,b:5,equations:[[2,1,19],[1,2,17]]});
reviseLogic(50,'Beş görev A–E: D ilk, A son. B, C’den hemen önce. E, B’den önce. Sıra ne?','Five tasks A–E: D is first, A last. B immediately precedes C, and E precedes B. What is the order?',['DEBCA','DBCEA','DECBA','EDBCA'],'D ve A uçlarda sabit. Ortada E–B–C zinciri kalır.','D and A occupy the ends; the middle must be E–B–C.',{kind:'order',items:'ABCDE',rules:[['pos','D',1],['pos','A',5],['offset','B','C',1],['before','E','B']],answer:'DEBCA'});
reviseLogic(51,'80 kişide A kulübü 32, B 30, C 28 kişi. Çift kesişimler, üçlü üyeleri de içererek AB=12, AC=10, BC=9. Üçlü kesişim 4. Hiçbir kulüpte olmayan kaç kişi?','Among 80 people, A has 32, B 30, C 28. Pairwise overlaps including triple members are AB=12, AC=10, BC=9. The triple overlap is 4. How many are in none?',['17','13','21','25'],'Birleşim 32+30+28−12−10−9+4=63. 80−63=17.','The union is 32+30+28−12−10−9+4=63, leaving 17.',{kind:'value',computed:80-(32+30+28-12-10-9+4),value:17});
reviseLogic(52,'Robotlar her zaman doğru ya da her zaman yanlış konuşuyor. A: “B yalancıdır.” B: “İkimiz farklı türdeyiz.” Hangisi geçerli?','Robots always tell the truth or always lie. A says “B is a liar.” B says “We are different types.” Which assignment works?',[pair('A yalancı, B doğrucu','A lies, B tells the truth'),pair('İkisi doğrucu','Both truthful'),pair('İkisi yalancı','Both liars'),pair('A doğrucu, B yalancı','A truthful, B a liar')],'A doğru olsa B yalancı olur; fakat B’nin sözü doğru çıkar, çelişir. A yalancı ve B doğrucu tutarlıdır.','If A were truthful, B would lie while making a true statement, a contradiction. A lying and B truthful is consistent.',{kind:'knavesTwo',solution:[false,true]});
reviseLogic(53,'4×4 hücreli ızgarada (0,0)’dan (4,4)’e yalnız sağa/aşağı gidilir. (1,1) ve (3,2) kesişimleri kapalı. Kaç yol kalır?','Move only right/down from (0,0) to (4,4) on a 4×4-cell grid. Intersections (1,1) and (3,2) are blocked. How many routes remain?',['18','16','20','30'],'70 toplam yoldan 40 ve 30 engelli yol çıkarılır; iki engelden geçen 18 geri eklenir: 18.','From 70 routes subtract 40 and 30, then add back the 18 passing both blockers: 18.',{kind:'grid',w:4,h:4,blocked:[[1,1],[3,2]],value:18});
reviseLogic(54,'Boş 7 ve 5 litrelik kaplarla tam 1 litre ölçülecek. Bir hamle doldurmak, boşaltmak veya durana kadar aktarmak. En az kaç hamle?','Use empty 7- and 5-liter jugs to measure exactly 1 liter. Each move fills, empties or pours until stopped. What is the minimum?',['8','6','7','9'],'5’i doldur ve 7’ye aktar. Yeniden 5’i doldur, 7’yi tamamla. 7’yi boşalt, kalan 3’ü aktar. 5’i doldur, 7’ye 4 aktar: 5’lik kapta 1 kalır.','Fill 5, pour to 7, fill 5 again, top up 7, empty 7, pour the remaining 3 to 7, refill 5, then pour 4 to 7. One remains.',{kind:'jugs',sizes:[7,5],target:1,value:8});
reviseLogic(55,'A şehri B’den 7 saat 45 dakika ileride; C, B’den 2 saat 30 dakika geride. A’da pazartesi 03.15 iken C’de saat ne?','City A is 7h45 ahead of B; C is 2h30 behind B. When A reads Monday 03:15, what time is it in C?',[pair('Pazar 17.00','Sunday 17:00'),pair('Pazar 18.45','Sunday 18:45'),pair('Pazartesi 13.30','Monday 13:30'),pair('Pazar 19.15','Sunday 19:15')],'C, A’dan 10 saat 15 dakika geride. Pazartesi 03.15’ten çıkarınca pazar 17.00 kalır.','C is 10h15 behind A. Subtracting from Monday 03:15 gives Sunday 17:00.',{kind:'value',computed:(3.25-10.25+24)%24,value:17});
reviseLogic(56,'4 kırmızı, 3 mavi bilyeden geri koymadan iki tane çekiliyor. Renklerinin farklı olma olasılığı kaç?','Draw two marbles without replacement from 4 red and 3 blue. What is the chance their colors differ?',['4/7','3/7','2/7','12/49'],'Toplam 21 ikili seçimin 4×3=12’si farklı renktir: 12/21=4/7.','Of 21 pairs, 4×3=12 have different colors: 12/21=4/7.',{kind:'differentColors',counts:[4,3],value:4/7});
reviseLogic(57,'6 bitlik kodda tam üç 1 var. İlk bit 1, son bit 0; art arda üç 1 bulunamaz. Kaç kod mümkün?','A 6-bit code contains exactly three 1s. The first is 1 and last 0, and three consecutive 1s are forbidden. How many codes remain?',['5','6','4','3'],'Ortadaki dört yere iki 1 koymanın 6 yolu var. 111000 yasaktır; 5 kalır.','Choose two middle positions in 6 ways. Exclude 111000; 5 remain.',{kind:'binarySystem',length:6,ones:3,value:5});
reviseLogic(58,'Kartların bir yüzü Latin harfi, diğeri sayı. Görünen yüzler B,E,3,8. “Tek sayı varsa diğer yüzde sesli harf vardır” kuralını sınamak için hangi kartlar çevrilmeli?','Cards have a Latin letter on one side and a number on the other. Visible faces are B,E,3,8. Which cards must be flipped to test “If odd number, then vowel”?',[pair('B ve 3','B and 3'),pair('E ve 3','E and 3'),pair('B ve 8','B and 8'),pair('E ve 8','E and 8')],'3’ün arkasında sesli harf olmalı; B’nin arkasında tek sayı olmamalı. E ve 8 kuralı ihlal edecek durumları zorunlu olarak sınamaz.','3 must have a vowel behind it; B must not have an odd number. E and 8 do not test the potential violations.');

const dossierKey='mindtrap-dossier-v10',dossierPermCache=new Map();let dossierData={serial:0,difficulty:'hard',active:null,archive:[],signatures:[]},dossierCase=null,dossierNotice='',dossierLink='';
function dossierPerms(n){if(dossierPermCache.has(n))return dossierPermCache.get(n);const out=[];function walk(a){if(a.length===n){out.push(a);return;}for(let v=1;v<=n;v++)if(!a.includes(v))walk([...a,v]);}walk([]);dossierPermCache.set(n,out);return out;}
function dossierTruth(c,a){const x=a[c.a],y=a[c.b];switch(c.type){case'lt':return x<y;case'diff':return x-y===c.v;case'gap':return Math.abs(x-y)===c.v;case'sum':return x+y===c.v;case'parity':return x%2===c.v;case'not':return x!==c.v;case'between':return (x>a[c.b]&&x<a[c.c])||(x<a[c.b]&&x>a[c.c]);default:return false;}}
function dossierGenerate(seed,difficulty,revision='10'){const n=revision==='11'?(difficulty==='hard'?6:5):(difficulty==='hard'?5:4),perms=dossierPerms(n);let r=seed>>>0;const rnd=m=>{r^=r<<13;r^=r>>>17;r^=r<<5;return (r>>>0)%m;};for(let trial=0;trial<200;trial++){const solution=perms[rnd(perms.length)],all=[];for(let a=0;a<n;a++){for(let v=1;v<=n;v++)all.push({type:'not',a,v});all.push({type:'parity',a,v:0},{type:'parity',a,v:1});for(let b=0;b<n;b++)if(a!==b){all.push({type:'lt',a,b});for(let v=1;v<n;v++)all.push({type:'gap',a,b,v},{type:'diff',a,b,v},{type:'diff',a,b,v:-v});for(let v=3;v<=2*n-1;v++)all.push({type:'sum',a,b,v});for(let c=b+1;c<n;c++)if(c!==a)all.push({type:'between',a,b,c});}}
const truth=all.filter(c=>dossierTruth(c,solution)),falsehood=all.filter(c=>!dossierTruth(c,solution));const clues=[falsehood[rnd(falsehood.length)]];let candidates=perms;for(let step=0;step<(revision==='11'?18:12);step++){let best=null,bestCandidates=null;for(let sample=0;sample<(revision==='11'?70:50);sample++){const c=truth[rnd(truth.length)];if(clues.some(x=>JSON.stringify(x)===JSON.stringify(c)))continue;const keep=candidates.filter(p=>clues.concat(c).filter(x=>!dossierTruth(x,p)).length<=1);if(!bestCandidates||keep.length<bestCandidates.length){best=c;bestCandidates=keep;}}if(!best)break;clues.push(best);candidates=bestCandidates;const exact=candidates.filter(p=>clues.filter(c=>!dossierTruth(c,p)).length===1);if(exact.length===1&&candidates.length===1&&clues.length>=5){for(let i=clues.length-1;i>0;i--){const j=rnd(i+1);[clues[i],clues[j]]=[clues[j],clues[i]];}return {seed,difficulty,n,clues,solution,falseIndex:clues.findIndex(c=>!dossierTruth(c,solution))};}}}throw Error('Could not generate unique evidence');}
function dossierValid(s){return s&&Number.isInteger(s.seed)&&s.seed>0&&s.seed<=2147483647&&['medium','hard'].includes(s.difficulty)&&Array.isArray(s.values)&&s.values.length===(s.revision==='11'?(s.difficulty==='hard'?6:5):(s.difficulty==='hard'?5:4))&&s.values.every(v=>Number.isInteger(v)&&v>=0&&v<=s.values.length)&&Number.isInteger(s.falseIndex)&&s.falseIndex>=-1&&s.falseIndex<20&&Array.isArray(s.notes)&&s.notes.length===s.values.length&&s.notes.every(row=>Array.isArray(row)&&row.length===s.values.length&&row.every(v=>typeof v==='boolean'))&&typeof s.done==='boolean'&&typeof s.hint==='boolean'&&Number.isInteger(s.stars)&&s.stars>=0&&s.stars<=3;}

function dossierName(i){return String.fromCharCode(65+i);}
function dossierClue(c){const A=dossierName(c.a),B=dossierName(c.b);switch(c.type){case'lt':return ft(`${A}, ${B}’den önce gelir.`,`${A} comes before ${B}.`);case'diff':return ft(`${A}’nın sıra numarası − ${B}’nin sıra numarası = ${c.v}.`,`${A}’s position − ${B}’s position = ${c.v}.`);case'gap':return ft(`${A} ile ${B}’nin sıra numaraları arasındaki fark ${c.v}.`,`The absolute difference between ${A}’s and ${B}’s positions is ${c.v}.`);case'sum':return ft(`${A} ile ${B}’nin sıra numaraları toplamı ${c.v}.`,`${A}’s and ${B}’s positions add up to ${c.v}.`);case'parity':return ft(`${A}’nın sıra numarası ${c.v?'tek':'çift'}.`,`${A}’s position is ${c.v?'odd':'even'}.`);case'not':return ft(`${A}, ${c.v}. sırada değildir.`,`${A} is not in position ${c.v}.`);case'between':return ft(`${A}, ${B} ile ${dossierName(c.c)} arasında gelir; bitişik olmaları gerekmez.`,`${A} comes between ${B} and ${dossierName(c.c)}; they need not be adjacent.`);}}
function dossierEvaluation(c,a){const x=a[c.a],y=a[c.b];return c.type==='sum'?`${x} + ${y} = ${x+y}`:c.type==='diff'?`${x} − ${y} = ${x-y}`:c.type==='gap'?`|${x} − ${y}| = ${Math.abs(x-y)}`:c.type==='lt'?`${x} < ${y}`:c.type==='not'?`${dossierName(c.a)} = ${x}`:c.type==='parity'?`${x} ${x%2?ft('tek','is odd'):ft('çift','is even')}`:`${Math.min(y,a[c.c])} < ${x} < ${Math.max(y,a[c.c])}`;}
function dossierHome(){screen='dossierHome';state=null;clearMemoryTimer();if(friendRun)saveFriends();friendRun=null;friendOpponent=null;app.innerHTML=header()+`<button class="secondary" data-action="home">← ${ft('Ana ekran','Home')}</button><section class="card hero"><div class="eyebrow">${ft('YENİ · KANITLARI ÇAPRAZ KONTROL ET','NEW · CROSS-CHECK THE EVIDENCE')}</div><div class="dossier-emblem">≠</div><h1>${dossierTitle()}</h1><p>${ft('Bir sinyal arşivine tek bir yanlış kayıt karıştı. A–F sinyallerinin gerçek sırasını kur ve yanlış kaydı işaretle. Dışarıdan bilgi gerekmez; bütün kanıtlar dosyada.','One false record has slipped into a signal archive. Reconstruct the order of signals A–F and identify the false record. All evidence is in the file; no outside knowledge is needed.')}</p><div class="difficulty-tabs">${['medium','hard'].map(d=>`<button data-action="dossierDifficulty" data-card="${d}" aria-pressed="${dossierData.difficulty===d}" class="${dossierData.difficulty===d?'primary':''}">${d==='hard'?ft('Zor · 6 sinyal','Hard · 6 signals'):ft('Orta · 5 sinyal','Medium · 5 signals')}</button>`).join('')}</div>${dossierData.active&&!dossierData.active.done?`<button class="primary full" data-action="dossierResume">${ft('Kaydedilen dosyaya devam et','Resume saved file')} →</button><p class="rule-note">${ft('Yeni dosyadan önce yarım kalan dosyanı tamamla veya çözümünü aç.','Finish your saved file or reveal its solution before starting another.')}</p>`:`<button class="primary full" data-action="dossierNew">${ft('Yeni dosya oluştur','Create a new file')} →</button>`}<div class="tags"><span>${ft('Tek cevap hakkı','One submission')}</span><span>${ft('Eleme notları','Elimination notes')}</span><span>${ft('Kilit veya anahtar yok','No unlock keys')}</span></div></section><section class="card"><h2>${ft('Dosya arşivi','File archive')}</h2><p>${ft('Son 60 dosya ve çözümleri burada saklanır. Aynı dosyadan tekrar yıldız kazanılmaz.','Your last 60 files and solutions stay here. Each function dossierNew(){if(dossierData.active&&!dossierData.active.done){dossierResume();return;}let p;for(let attempt=0;attempt<30;attempt++){dossierData.serial++;const seed=((Math.imul(dossierData.serial,104729)+177013)>>>0)%2147483646+1;p=dossierGenerate(seed,dossierData.difficulty,'11');const signature=JSON.stringify([p.n,p.clues.slice().sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))]);if(!dossierData.signatures.includes(signature)){dossierData.signatures.push(signature);dossierData.signatures=dossierData.signatures.slice(-1000);break;}p=null;}if(!p){dossierNotice=ft('Yeni bir dosya oluşturulamadı. Tekrar deneyebilirsin.','Could not create a fresh file. Please try again.');dossierHome();app.innerHTML+=`<p class="warning">${dossierNotice}</p>`;return;}dossierData.active={seed:p.seed,difficulty:p.difficulty,revision:'11',values:Array(p.n).fill(0),notes:Array.from({length:p.n},()=>Array(p.n).fill(false)),falseIndex:-1,done:false,hint:false,stars:0};dossierCase=p;dossierNotice='';dossierLink='';dossierSave();dossierRender();}

function dossierRender(){const s=dossierData.active,p=dossierCase;if(!s||!p)return;screen='dossierGame';state=null;const full=s.values.every(Boolean)&&new Set(s.values).size===p.n&&s.falseIndex>=0;app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="dossierHome">← ${dossierTitle()}</button><small>#${s.seed} · ${s.difficulty==='hard'?ft('Zor','Hard'):ft('Orta','Medium')}</small></div><section class="card"><div class="eyebrow">${ft('SİNYAL ARŞİVİ · BİR KAYIT YANLIŞ','SIGNAL ARCHIVE · ONE FALSE RECORD')}</div><h1>${dossierTitle()}</h1><p>${ft(`Her sinyal, 1–${p.n} arasında farklı bir sırada. Kayıtlardan tam biri yanlış; diğerlerinin hepsi doğru. Hem sıralamayı hem yanlış kaydı bul.`,`Each signal occupies a different position from 1 to ${p.n}. Exactly one record is false; all others are true. Find both the order and the false record.`)}</p><p class="rule-note">${ft('Seçimleri ve notları istediğin kadar düzenle. “Dosyayı gönder” tek cevap hakkını kullanır.','Edit choices and notes freely. “Submit file” uses your one answer.')}</p></section><section class="card"><h2>${ft('Sıralamayı kur','Reconstruct the order')}</h2><div class="dossier-values">${s.values.map((v,i)=>`<div><strong>${ft('Sinyal','Signal')} ${dossierName(i)}</strong><div class="dossier-digits">${Array.from({length:p.n},(_,j)=>`<button data-action="dossierValue" data-index="${i}" data-card="${j+1}" aria-pressed="${v===j+1}" ${s.done?'disabled':''} class="${v===j+1?'primary':''}" aria-label="${dossierName(i)}: ${j+1}">${j+1}</button>`).join('')}</div></div>`).join('')}</div>${!s.done&&s.values.filter(Boolean).length!==new Set(s.values.filter(Boolean)).size?`<p class="warning">${ft('Her sıra numarası yalnızca bir kez kullanılabilir.','Each position can be used only once.')}</p>`:''}</section><section class="card"><h2>${ft('Yanlış kaydı seç','Select the false record')}</h2><div class="dossier-clues">${p.clues.map((c,i)=>`<button data-action="dossierFalse" data-index="${i}" aria-pressed header=function(){applyUI11();document.body.dataset.view=screen;return `<header><div><div class="brand"><span>◈</span> MINDTRAP</div><small>${ft('Merakını takip et.','Follow your curiosity.')} · v0.11</small></div><div class="header-tools"><div class="language" aria-label="Language"><button data-action="lang" data-lang="tr" aria-pressed="${lang==='tr'}" class="${lang==='tr'?'selected':''}">TR</button><button data-action="lang" data-lang="en" aria-pressed="${lang==='en'}" class="${lang==='en'?'selected':''}">EN</button></div><button class="ui-toggle" data-action="uiTheme" aria-label="${ft('Açık veya koyu tema','Light or dark theme')}">${ui11.theme==='dark'?ft('☀ Açık','☀ Light'):ft('◐ Koyu','◐ Dark')}</button><button class="ui-toggle" data-action="uiText" aria-pressed="${ui11.large}" aria-label="${ft('Büyük yazı','Large text')}">A${ui11.large?'−':'+'}</button></div></header>`;};
const hubs11={logic:{title:pair('Mantık','Reasoning'),desc:pair('Çok adımlı sorular ve çelişkili kayıtlar.','Multi-step questions and contradictory records.'),icon:'classic',modes:['logic','dossier']},visual:{title:pair('Görsel Zeka','Visual Intelligence'),desc:pair('Gizli kuralları çıkar. İnce değişiklikleri yakala.','Infer hidden rules. Spot subtle changes.'),icon:'memory',modes:['rules','memory']},world:{title:pair('Dünya Dosyaları','World Files'),desc:pair('Bilgi, güven ve ipuçları tek keşif bölümünde.','Knowledge, confidence and clues in one exploration hub.'),icon:'trivia',modes:['trivia','confidence','detective','market','connections']},friends:{title:pair('Arkadaşlarla Oyna','Play with Friends'),desc:pair('Ortak ipuçlarıyla çöz veya aynı bulmacalarda yarış.','Combine clues or compete on the same puzzles.'),icon:'coop',modes:['coop','duel']}};
function hubTitle11(id){return text(hubs11[id].title);}
function modeItem11(id){const names={logic:freshTitle('logic'),dossier:dossierTitle(),rules:ruleLabel(),memory:memoryTitle(),trivia:triviaTitle(),confidence:freshTitle('confidence'),detective:freshTitle('detective'),market:freshTitle('market'),connections:freshTitle('connections'),coop:freshTitle('coop'),duel:ft('Meydan Okuma','Challenge')};const descriptions={logic:freshInstruction('logic'),dossier:ft('5–6 sinyali sırala ve tek yanlış kaydı bul. Eleme notların kaydedilir.','Order 5–6 signals and find the one false record. Elimination notes are saved.'),rules:ft('18 yeni kural. Gruplar ve ağırlıklı puanlar birlikte.','18 new rules. Groups and weighted scores together.'),memory:ft('20 yeni düzen. 12–16 kartta ayrıntı avı.','20 new arrangements. Hunt for details in 12–16 cards.'),trivia:ft('Şehir, ülke ve dünya için 24 yeni ayrıntı sorusu.','24 new detailed questions about cities, countries and the world.'),confidence:freshInstruction('confidence'),detective:freshInstruction('detective'),market:freshInstruction('market'),connections:freshInstruction('connections'),coop:freshInstruction('coop'),duel:ft('Bir paket seç, arkadaşına gönder, sonuç bağlantılarını karşılaştır.','Choose a pack, send it to a friend and compare result links.')};const actions={logic:'classicHome',dossier:'dossierHome',rules:'rules',memory:'memoryHome',trivia:'triviaHome',duel:'friends'};return {title:names[id],desc:descriptions[id],action:actions[id]||'newModeHome',card:actions[id]?'':id};}
const heroArt11=`<svg class="launch-art" viewBox="0 0 260 260" aria-hidden="true" fill="none"><circle cx="145" cy="120" r="82" stroke="#aac3ff" stroke-width="1.5"/><path d="M67 181L177 36l55 160z" stroke="#80d5c8" stroke-width="2"/><rect x="42" y="75" width="113" height="113" rx="22" transform="rotate(-15 98 131)" stroke="#ffd597" stroke-width="2"/><circle cx="176" cy="96" r="11" fill="#ffd597"/><circle cx="93" cy="171" r="5" fill="#a6c0ff"/></svg>`;
renderHome=function(){screen='home';state=null;const key=dateKey(),stars=Object.entries(records).filter(([k])=>!k.startsWith('daily:')).reduce((n,[,v])=>n+v.stars,0);app.innerHTML=header()+`<section class="launch-hero">${heroArt11}<div class="eyebrow">MINDTRAP · ${ft('YENİ SEZON','NEW SEASON')}</div><h1>${ft('Bir adım daha<br>derin düşün.','Think one<br>step deeper.')}</h1><p>${ft('Dört bölüm. Daha güçlü sorular.<br>Bir sonraki keşfin burada.','Four collections. Stronger questions.<br>Your next discovery starts here.')}</p><div class="launch-pills"><span>TR / EN</span><span>${ft('Tek cevap hakkı','One answer')}</span><span>${ft('Süre baskısı yok','No timer')}</span></div></section><div class="hub-caption"><strong>${ft('Nereden başlayalım?','Where shall we start?')}</strong><small>${stars} ★</small></div><div class="hub-grid">${Object.entries(hubs11).map(([id,h],i)=>`<section class="hub-card"><div class="hub-caption"><div class="hub-icon">${modeIcon(h.icon)}</div><div class="eyebrow">0${i+1}</div></div><h2>${text(h.title)}</h2><p>${text(h.desc)}</p><button data-action="collection" data-card="${id}">${ft('Keşfet','Explore')} →</button></section>`).join('')}</div><section class="daily-strip"><div><div class="eyebrow">${ft('GÜNLÜK BULMACA','DAILY PUZZLE')}</div><h2>${dailyDone[key]?'✓ '+ft('Bugün tamamlandı','Completed today'):ft('8 sinyalli yeni devre','New eight-signal circuit')}</h2><p>${key} · ${ft('Seri','Streak')}: ${lastDaily===key||lastDaily===previousDay(key)?streak:0}</p></div><button class="primary" data-action="daily">${ft('Oyna','Play')} →</button></section><details class="card" style="margin-top:20px"><summary>${ft('Bu güncellemede neler değişti?','What changed in this update?')}</summary><p>${ft('Bütün aktif oyunların yeni havuzları açıldı. Önceki yıldızların ve tamamladığın bölümler korunur. Benzer oyunlar aynı keşif bölümünde; oyun içinde tek cevap hakkı geçerlidir.','All active games now have new pools. Earlier stars and completed levels remain saved. Similar games share a collection, and each question allows one answer.')}</p><p>${ft('Açık/koyu tema ve büyük yazı seçeneklerini üstten değiştirebilirsin.','Use the top controls to switch light/dark theme and enlarge text.')}</p></details>${storageNote()}`;};
function renderCollection11(id=collection11){if(!hubs11[id])return;collection11=id;screen='collection';state=null;clearMemoryTimer();if(friendRun)saveFriends();friendRun=null;friendOpponent=null;const h=hubs11[id];app.innerHTML=header()+`<button class="secondary" data-action="home">← ${ft('Ana ekran','Home')}</button><div class="eyebrow" style="margin-top:24px">${ft('BİR OYUN TÜRÜ SEÇ','CHOOSE A GAME TYPE')}</div><h1>${text(h.title)}</h1><p class="hub-subtitle">${text(h.desc)}</p><div class="collection-list">${h.modes.map(id=>{const m=modeItem11(id);return `<section class="card"><div class="mode-icon">${id==='dossier'?'<span class="dossier-emblem">≠</span>':modeIcon(id==='duel'?'coop':id==='logic'?'classic':id)}</div><h2>${m.title}</h2><p>${m.desc}</p><button class="primary full" data-action="${m.action}" data-card="${m.card}">${ft('Oyna','Play')} →</button></section>`;}).join('')}</div>${storageNote()}`;}
const previousRedraw11=redraw;redraw=function(){if(screen==='collection')renderCollection11();else previousRedraw11();document.documentElement.lang=lang;applyUI11();};
const previousAct11=act;act=function(action,index,card,chosenLang){if(action==='uiTheme'){ui11.theme=ui11.theme==='dark'?'light':'dark';saveUI11();redraw();return;}if(action==='uiText'){ui11.large=!ui11.large;saveUI11();redraw();return;}if(action==='collection'){renderCollection11(card);window.scrollTo?.({top:0,behavior:'instant'});return;}if(action==='freshChoice'&&freshRun?.mode==='coop'){if(screen==='freshGame'&&!freshAnswered&&Number.isInteger(index)&&coopPuzzle(activeFresh().id,freshRun.seed).cards[index]){freshSelected=index;renderFreshGame();}return;}if(action==='triviaTier')return;previousAct11(action,index,card,chosenLang);};

redraw();
openChallenge();
