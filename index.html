light(pair('İlk Kıvılcım','First Spark'),3,0,[3,6,4],[0,2],[pair('Bir anahtar birkaç ışığı değiştirebilir.','One switch can affect several lights.'),pair('İlk iki ışığı birlikte, sonuncuyu tek başına yak.','Light the first two together, then the last one alone.')],pair('1. anahtar ilk iki ışığı, 3. anahtar son ışığı yakar.','Switch 1 lights the first two; switch 3 lights the last.'));

rule('Dört köşeli şekli seç.','Choose the four-cornered shape.','Yönü değişse de köşe sayısı aynı kalır.','Rotation does not change the corner count.',s=>s.kind==='square');

rule('İçi boş üçgeni seç.','Choose the hollow triangle.','Hem dış çizgi hem iç alan önemli.','Both outline and interior matter.',s=>s.kind==='triangle'&&!s.fill);

rule('İçi dolu şekiller arasından en küçüğünü seç.','Choose the smallest filled shape.','Önce içi boş şekilleri ele.','First exclude hollow shapes.',(s,a)=>s.fill&&s.size===Math.min(...a.filter(x=>x.fill).map(x=>x.size)));
rule('Tek sayıda nokta içeren şekli seç.','Choose the shape with an odd number of dots.','Noktaları ikişer eşleştir.','Pair up the dots.',s=>s.dots%2===1);
rule('İçi boş şekiller arasından en büyüğünü seç.','Choose the largest hollow shape.','Önce dolu şekilleri ele.','First exclude filled shapes.',(s,a)=>!s.fill&&s.size===Math.max(...a.filter(x=>!x.fill).map(x=>x.size)));
rule('İkinci en büyük şekli seç.','Choose the second largest shape.','Boyutları sırala; ilkini atla.','Sort by size; skip the first.',(s,a)=>s.size===[...a].sort((x,y)=>y.size-x.size)[1].size);
rule('Noktası olmayan, içi dolu şekli seç.','Choose the filled shape with no dots.','İç alanın rengi ve işaretleri birlikte önemli.','Interior color and marks both matter.',s=>s.fill&&s.dots===0);
rule('Nokta sayısı köşe sayısından fazla olan şekli seç.','Choose the shape with more dots than corners.','İki sayıyı karşılaştır.','Compare two counts.',s=>s.dots>({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi boş, çift sayıda nokta içeren şekli seç. Sıfır da çifttir.','Choose the hollow shape with an even number of dots. Zero is even.','İki koşul var: dolgu ve sayı çiftliği.','Two conditions: fill and evenness.',s=>!s.fill&&s.dots%2===0);

rule('Üç şekil doluysa boş olanı, üçü boşsa dolu olanı seç.','Choose the only shape with different fill.','Çoğunluğun tersini ara.','Look for the opposite of the majority.',(s,a)=>a.filter(x=>x.fill===s.fill).length===1);
rule('İkinci en küçük şekli seç.','Choose the second smallest shape.','En küçüğe aldanma; bir sıra yukarı çık.','Do not pick the smallest; move up one rank.',(s,a)=>s.size===[...a].sort((x,y)=>x.size-y.size)[1].size);
rule('Nokta sayısı diğer üçünden farklı olan şekli seç.','Choose the shape with a different dot count from the other three.','Noktaları tek tek değil, gruplar arasında karşılaştır.','Compare dot counts across the group.',(s,a)=>a.filter(x=>x.dots===s.dots).length===1&&a.some(x=>a.filter(y=>y.dots===x.dots).length===3));
rule('En az noktaya sahip dolu şekli seç.','Choose the filled shape with the fewest dots.','Önce dolgu, sonra sayı.','First fill, then count.',(s,a)=>s.fill&&s.dots===Math.min(...a.filter(x=>x.fill).map(x=>x.dots)));
rule('Köşe sayısı nokta sayısından bir fazla olan şekli seç.','Choose the shape with one more corner than dots.','Eşitlik arama; fark bir.','Look for a difference of one.',s=>({circle:0,triangle:3,square:4,pentagon:5})[s.kind]===s.dots+1);
rule('En büyük şekille aynı sayıda nokta içeren diğer şekli seç.','Choose the other shape with as many dots as the largest shape.','En büyük şekil cevap değil, referans.','The largest shape is a reference.',(s,a)=>s.size!==Math.max(...a.map(x=>x.size))&&s.dots===a.find(x=>x.size===Math.max(...a.map(y=>y.size))).dots);
rule('En küçük şekille aynı renkte olan diğer şekli seç.','Choose the other shape with the same color as the smallest shape.','Küçük şekli bul, sonra renk eşini ara.','Find the smallest, then its color partner.',(s,a)=>s.size!==Math.min(...a.map(x=>x.size))&&s.color===a.find(x=>x.size===Math.min(...a.map(y=>y.size))).color);
rule('Nokta sayısı farklıysa en çok noktalıyı; eşitse en büyüğü seç.','Choose the most dots; break a tie by choosing the largest.','İki şekil eşitse boyut karar verir.','Size breaks a tie.',(s,a)=>s.dots===Math.max(...a.map(x=>x.dots))&&s.size===Math.max(...a.filter(x=>x.dots===s.dots).map(x=>x.size)));
rule('Nokta sayısı köşe sayısının yarısı olan şekli seç.','Choose the shape with half as many dots as corners.','Köşeleri ikişer eşleştir.','Pair up the corners.',s=>s.dots*2===({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('En büyük ve en küçük şekli ele; kalan iki şekilden daha çok noktalıyı seç.','Discard the largest and smallest; choose more dots among the remaining two.','Uçları ele, ortadakileri karşılaştır.','Remove the extremes, compare the middle.',(s,a)=>{const mid=[...a].sort((x,y)=>x.size-y.size).slice(1,3);return mid.includes(s)&&s.dots===Math.max(...mid.map(x=>x.dots));});

const shapeColors=['#92efd2','#bcaaff','#ffd27b','#ff91ba'];
function generateChoices(level,round){
 // Seeded rounds reproduce the same puzzle on restart without revealing the rule.
 let seed=(level+1)*98731+(round+1)*1237;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const int=n=>Math.floor(rand()*n);
 for(let attempt=0;attempt<10000;attempt++){
  const sizes=[38,52,66,80];for(let j=3;j>0;j--){const k=int(j+1);[sizes[j],sizes[k]]=[sizes[k],sizes[j]];}
  const a=sizes.map(size=>({size,kind:['circle','triangle','square','pentagon'][int(4)],color:int(4),fill:!!int(2),dots:int(6)}));
  if([0,4,13,15,16,21,25,26,27,29].includes(level)){const sameKind=a[0].kind;a.forEach(x=>x.kind=sameKind);}
  if(level===5||level===9){const field=level===5?'color':'kind';const common=a[0][field];a.forEach(x=>x[field]=common);const k=int(4);a[k][field]=field==='color'?(common+1+int(3))%4:['circle','triangle','square','pentagon'].filter(x=>x!==common)[int(3)];}
  if(level===22){const common=int(6);a.forEach(x=>x.dots=common);a[int(4)].dots=(common+1+int(5))%6;}
  if(level===27){const low=[...a].sort((x,y)=>x.size-y.size);low[0].dots=1;low[1].dots=2;low[2].dots=4;low[3].dots=4;}
  if(level===29&&new Set([...a].sort((x,y)=>x.size-y.size).slice(1,3).map(x=>x.dots)).size!==2)continue;
  if(level===23&&a.filter(x=>x.fill).length<2)continue;
  if([13,15].includes(level)&&a.filter(x=>x.fill===(level===13)).length<2)continue;
  if(level===6&&new Set(a.map(x=>x.dots)).size<3)continue;
  if(ruleLevels[level].test&&a.filter(x=>ruleLevels[level].test(x,a)).length===1)return a;
 }
 throw new Error('Cannot construct rule level '+level);
}
function shapeSvg(s){
 const r=s.size/2,c=shapeColors[s.color];let outline='';
 if(s.kind==='circle')outline=`<circle cx="50" cy="50" r="${r}"/>`;
 else{const n={triangle:3,square:4,pentagon:5}[s.kind],offset=s.kind==='square'?Math.PI/4:-Math.PI/2;const pts=Array.from({length:n},(_,i)=>{const a=offset+i*2*Math.PI/n;return (50+r*Math.cos(a))+','+(50+r*Math.sin(a));}).join(' ');outline=`<polygon points="${pts}"/>`;}
 const dots=Array.from({length:s.dots},(_,i)=>{const a=i*2*Math.PI/s.dots;return `<circle cx="${s.dots===1?50:50+6*Math.cos(a)}" cy="${s.dots===1?50:50+6*Math.sin(a)}" r="2.3" fill="${s.fill?'#101222':'#ffffff'}"/>`;}).join('');
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${s.fill?c:'none'}" stroke="${c}" stroke-width="3" stroke-linejoin="round">${outline}</g>${dots}</svg>`;
}

quiz('world',pair('Nil Nehri hangi denize dökülür?','Into which sea does the Nile River flow?'),[pair('Akdeniz','Mediterranean Sea'),pair('Kızıldeniz','Red Sea'),pair('Karadeniz','Black Sea'),pair('Arap Denizi','Arabian Sea')],pair('Nil, Mısır kıyısında Akdeniz’e ulaşır.','The Nile reaches the Mediterranean on Egypt’s coast.'),'https://education.nationalgeographic.org/resource/nile-river/');


let triviaRun=null,triviaAnswered=false,triviaChoices=[];let triviaHistory={};
try{const data=JSON.parse(localStorage.getItem('mindtrap-trivia-v07')||'{}');if(data&&typeof data==='object'&&!Array.isArray(data))for(const [k,v]of Object.entries(data))if(/^\d{1,2}$/.test(k)&&Number(k)<30&&v&&typeof v.correct==='boolean')triviaHistory[k]={correct:v.correct};}catch(e){}
function triviaTitle(){return ft('Dünyayı Keşfet','World Quest');}
function categoryTitle(c){return c==='cities'?ft('Şehirler','Cities'):c==='countries'?ft('Ülkeler','Countries'):c==='world'?ft('Dünya','World'):ft('Karışık','Mixed');}
function shuffleWithSeed(items,seed){const a=[...items];let v=seed>>>0;for(let i=a.length-1;i>0;i--){v=(Math.imul(v,1664525)+1013904223)>>>0;const j=v%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function triviaIds(category,seed){return shuffleWithSeed(triviaQuestions.filter(q=>category==='mix'||q.category===category).map(q=>q.id),seed).slice(0,5);}
function saveTrivia(){try{localStorage.setItem('mindtrap-trivia-v07',JSON.stringify(triviaHistory));}catch(e){storageOK=false;}}
function currentTrivia(){return triviaQuestions[triviaRun.ids[triviaRun.index]];}
function loadTriviaQuestion(){triviaAnswered=false;triviaChoices=shuffleWithSeed([0,1,2,3],triviaRun.seed+currentTrivia().id*987+triviaRun.index*37);screen='triviaGame';state=null;renderTriviaGame();}
function startTrivia(category){if(!['cities','countries','world','mix'].includes(category))return;const seed=Math.floor(Math.random()*1000000000)+1;triviaRun={category,seed,ids:triviaIds(category,seed),index:0,answers:[]};loadTriviaQuestion();}
function startFriendTrivia(){triviaRun={category:'mix',seed:friendRun.seed,ids:friendIds(friendRun.seed,'trivia'),index:friendRun.scores.length,answers:[]};loadTriviaQuestion();}
function pickTrivia(i){if(screen!=='triviaGame'||triviaAnswered||!Number.isInteger(i)||i<0||i>3)return;const q=currentTrivia(),correct=triviaChoices[i]===0;triviaAnswered=true;triviaRun.answers.push({id:q.id,chosen:triviaChoices[i],correct});triviaHistory[q.id]={correct:correct||!!triviaHistory[q.id]?.correct};if(correct)recordRun('trivia:'+q.id,3,1);saveTrivia();if(friendRun&&friendRun.difficulty==='trivia'&&friendRun.scores.length===triviaRun.index){friendRun.scores.push({stars:correct?3:0,attempts:1});saveFriends();}renderTriviaGame();}
function triviaNext(){if(!triviaAnswered)return;if(friendRun){advanceFriend();return;}if(triviaRun.index<4){triviaRun.index++;loadTriviaQuestion();}else renderTriviaResult();}
function renderTriviaHome(){screen='triviaHome';state=null;app.innerHTML=header()+`<button class="secondary" data-action="home">← ${ft('Ana ekran','Home')}</button><section class="card hero"><div class="eyebrow">WORLD QUEST · TR / EN</div><div class="quest-hero-icon">${modeIcon('trivia')}</div><h1>${triviaTitle()}</h1><p>${ft('Şehirlerden ülkelere, okyanuslardan dağlara. Her tur 5 soru, her soruda 4 seçenek. Cevabını seç, yeni bir bilgi öğren.','From cities to countries, oceans to mountains. Five questions per round, four choices per question. Choose an answer and discover a new fact.')}</p><div class="tags"><span>30 ${ft('soru','questions')}</span><span>${ft('Süre baskısı yok','No timer')}</span><span>${Object.values(triviaHistory).filter(x=>x.correct).length}/30 ${ft('öğrenildi','mastered')}</span></div><button class="primary full" data-action="triviaStart" data-card="mix">${ft('Karışık tur oyna','Play a mixed round')} →</button><button class="full" data-action="triviaFriends">${friendTitle()} →</button></section><div class="quest-categories">${['cities','countries','world'].map(c=>`<button class="category-card" data-action="triviaStart" data-card="${c}"><span>${c==='cities'?'⌂':c==='countries'?'⚑':'◎'}</span><strong>${categoryTitle(c)}</strong><small>10 ${ft('soru','questions')} · 5 ${ft('soruluk tur','per round')}</small></button>`).join('')}</div><section class="card"><p class="rule-note">${ft('Her soru için tek cevap hakkın var. Her doğru cevap 3 yıldız getirir. Açıklamalar ve kaynak bağlantıları cevap verdikten sonra görünür.','You get one answer per question. Each correct answer earns 3 stars. Explanations and source links appear after you answer.')}</p><small>${ft('Sorular UNESCO, NOAA, NASA ve ilgili kurumların kaynaklarıyla kontrol edildi.','Questions were checked against UNESCO, NOAA, NASA and other institutional sources.')}</small></section>${storageNote()}`;}
function renderTriviaGame(){screen='triviaGame';const q=currentTrivia(),answer=triviaRun.answers.find(a=>a.id===q.id);app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="${friendRun?'friendLobby':'triviaHome'}">← ${friendRun?friendTitle():triviaTitle()}</button><small>${ft('Soru','Question')} ${triviaRun.index+1} / 5</small></div><div class="progress"><div style="width:${(triviaRun.index+(triviaAnswered?1:0))*20}%"></div></div><div class="eyebrow">${categoryTitle(q.category)} · WORLD QUEST</div><section class="card quiz-card">${q.flag?'<svg class="japan-flag" viewBox="0 0 150 100" role="img" aria-label="'+ft('Beyaz zemin üzerinde kırmızı daire','Red circle on a white background')+'"><rect width="150" height="100" fill="white" rx="5"/><circle cx="75" cy="50" r="30" fill="#bc002d"/></svg>':`<div class="quiz-symbol" aria-hidden="true">${modeIcon('trivia')}</div>`}<h2>${text(q.question)}</h2><div class="quiz-options">${triviaChoices.map((option,i)=>`<button class="quiz-option ${triviaAnswered?(option===0?'quiz-correct':option===answer?.chosen?'quiz-wrong':''):''}" data-action="triviaPick" data-index="${i}" ${triviaAnswered?'disabled':''}><span>${String.fromCharCode(65+i)}</span><strong>${text(q.options[option])}</strong>${triviaAnswered&&option===0?'<span aria-label="'+ft('Doğru cevap','Correct answer')+'">✓</span>':''}</button>`).join('')}</div></section>${triviaAnswered?`<div class="solution"><strong role="status">${answer?.correct?ft('Doğru! +3 ★','Correct! +3 ★'):ft('Yeni bir bilgi öğrendin.','You learned something new.')}</strong><p>${text(q.fact)}</p><a href="${q.url}" target="_blank" rel="noopener noreferrer">${ft('Kaynağı incele','Read the source')} ↗</a></div><button class="primary full" data-action="triviaNext">${triviaRun.index===4?ft('Sonuçları gör','View results'):ft('Sonraki soru','Next question')} →</button>`:`<p class="rule-note" role="status">${ft('Tek cevap hakkın var. Süre sınırı yok.','One answer per question. No time limit.')}</p>`}${friendRun?`<section class="card"><strong>${friendTitle()}</strong><p>${escapeMarkup(friendRun.name)} · ${friendStats(friendRun.scores)}</p></section>`:''}${storageNote()}`;}
function renderTriviaResult(){screen='triviaResult';const correct=triviaRun.answers.filter(a=>a.correct).length;app.innerHTML=header()+`<section class="card hero"><div class="eyebrow">WORLD QUEST · ${categoryTitle(triviaRun.category)}</div><h1>${ft('Keşif tamamlandı!','Quest complete!')}</h1><div class="quiz-total">${correct}<small> / 5</small></div><p class="stars">${correct*3} / 15 ★</p><p>${ft('Her cevap, dünyaya açılan yeni bir pencere.','Every answer opens another window onto the world.')}</p><button class="primary full" data-action="triviaRestart">${ft('Yeni 5 soru','Another 5 questions')} →</button><button class="full" data-action="triviaFriends">${friendTitle()} →</button><button class="secondary full" data-action="triviaHome">${ft('Kategoriler','Categories')}</button></section>${triviaRun.answers.map(a=>{const q=triviaQuestions[a.id];return `<details class="card"><summary>${a.correct?'✓':'○'} ${text(q.question)}</summary><p><strong>${text(q.options[0])}</strong> · ${text(q.fact)}</p><a href="${q.url}" target="_blank" rel="noopener noreferrer">${ft('Kaynak','Source')} ↗</a></details>`;}).join('')}${storageNote()}`;}
const questFriendStats=friendStats;friendStats=function(scores){return friendRun?.difficulty==='trivia'?`${scores.filter(s=>s.stars===3).length} / 5 ${ft('doğru','correct')} · ${friendScoresTotal(scores).stars} / 15 ★`:questFriendStats(scores);};
const questFriendHelp=friendHelp;friendHelp=function(){return (friendRun?.difficulty||friendDraftDifficulty)==='trivia'?`<p class="rule-note">${ft('Aynı 5 bilgi sorusunu aynı seçeneklerle çözün. Her doğru cevap 3 yıldız getirir. Her soru için tek cevap hakkı vardır. Sonuçları bağlantıyla gönderip karşılaştırın.','Answer the same 5 trivia questions with the same choices. Each correct answer earns 3 stars. One answer per question. Send results by link to compare.')}</p>`:questFriendHelp();};
function modeIcon(mode){const content=mode==='classic'?'<path d="M18 24c-8 0-12 6-12 14s5 13 12 13m28-27c8 0 12 6 12 14s-5 13-12 13M18 18c0-9 14-9 14 0v38m14-38c0-9-14-9-14 0M18 29h6m-8 14h8m22-14h-6m8 14h-8"/>':mode==='rules'?'<circle cx="17" cy="17" r="9"/><path d="M45 8l12 20H33z"/><rect x="8" y="38" width="19" height="19" rx="3"/><path d="M44 35l15 13-15 13-13-13z"/>':mode==='memory'?'<path d="M4 32s10-17 28-17 28 17 28 17-10 17-28 17S4 32 4 32z"/><circle cx="32" cy="32" r="9"/><path d="M47 8l4-5m6 15 6-1"/>':'<circle cx="32" cy="32" r="25"/><ellipse cx="32" cy="32" rx="12" ry="25"/><path d="M8 23h48M8 41h48M32 7v50"/>';return `<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${content}</svg>`;}
function renderClassicHome(){screen='classicHome';state=null;app.innerHTML=header()+`<button class="secondary" data-action="home">← ${ft('Ana ekran','Home')}</button><section class="card hero"><div class="eyebrow">20 ${t('levels')}</div><h1>${ft('Mantık Atölyesi','Logic Lab')}</h1><p>${ft('Işıkları bağla, sayıları dönüştür ve ipuçlarından sıralamayı kur.','Connect lights, transform numbers and arrange cards using clues.')}</p><button class="primary full" data-action="continue">${t('continue')} →</button></section><div class="row"><strong>${t('levels')}</strong><small>${completed.length}/20 ${t('done')}</small></div><div class="progress"><div style="width:${completed.length*5}%"></div></div><div class="level-grid">${levels.map((l,i)=>`<button class="level-button ${completed.includes(i)?'complete':''}" data-action="open" data-index="${i}"><span>${completed.includes(i)?'✓':'◇'} ${String(i+1).padStart(2,'0')} · ${difficulty(i)}</span><strong>${text(l.title)}</strong><small>${kind(l)}</small>${earnedHtml('classic:'+i)}</button>`).join('')}</div>${storageNote()}`;}
renderHome=function(){screen='home';state=null;const key=dateKey(),dailySolved=!!dailyDone[key],stars=Object.entries(records).filter(([k])=>!k.startsWith('daily:')).reduce((n,[,r])=>n+r.stars,0);const modes=[{id:'classic',action:'classicHome',title:ft('Mantık Atölyesi','Logic Lab'),desc:ft('Bağla. Sırala. Çöz.','Connect. Arrange. Solve.'),count:20,done:completed.length},{id:'rules',action:'rules',title:ruleLabel(),desc:ft('Gizli bağlantıyı keşfet.','Discover the hidden connection.'),count:30,done:ruleCompleted.length},{id:'memory',action:'memoryHome',title:memoryTitle(),desc:ft('Bak. Hatırla. Farkı bul.','Look. Remember. Spot it.'),count:20,done:memoryCompleted.length},{id:'trivia',action:'triviaHome',title:triviaTitle(),desc:ft('Şehir, ülke ve dünya.','Cities, countries and the world.'),count:30,done:Object.values(triviaHistory).filter(v=>v.correct).length}];app.innerHTML=header()+`<section class="home-hero"><div class="eyebrow">THINK DIFFERENT. BREAK THE RULES.</div><h1>${ft('Zihnini<br><span>şaşırt.</span>','Give your mind<br><span>a twist.</span>')}</h1><p>${ft('Biraz merak. Biraz meydan okuma.<br>Her dokunuşta yeni bir keşif.','A little curiosity. A little challenge.<br>A new discovery with every tap.')}</p><div class="home-pills"><span>4 ${ft('oyun modu','game modes')}</span><span>TR / EN</span><span>${ft('Süre baskısı yok','No timer')}</span></div></section><section class="daily-spotlight"><div><div class="eyebrow">${ft('BUGÜNÜN MEYDAN OKUMASI','TODAY’S CHALLENGE')}</div><h2>${dailySolved?'✓ '+t('todayDone'):ft('Bugünün devresini çöz.','Crack today’s circuit.')}</h2><p>${key} · ${t('streak')}: ${lastDaily===key||lastDaily===previousDay(key)?streak:0} ${t('days')}</p></div><button class="primary" data-action="daily">${ft('Oyna','Play')} →</button></section><div class="section-caption"><strong>${ft('Bir oyun seç','Choose your adventure')}</strong><small>${stars} / 300 ★</small></div><div class="mode-grid">${modes.map(m=>`<section class="mode-card mode-${m.id}"><div class="mode-top"><div class="mode-icon">${modeIcon(m.id)}</div><span class="mode-badge">${m.count} ${m.id==='trivia'?ft('soru','questions'):t('levels')}</span></div><h2>${m.title}</h2><p>${m.desc}</p><div class="mode-progress"><span style="width:${m.done*100/m.count}%"></span></div><div class="mode-bottom"><small>${m.done}/${m.count}</small><button data-action="${m.action}">${ft('Oyna','Play')} ↗</button></div></section>`).join('')}</div><section class="friends-spotlight"><div><div class="eyebrow">CHALLENGE FRIENDS</div><h2>${friendTitle()}</h2><p>${ft('Aynı 5 bulmaca. İki farklı zihin. Kim daha iyi çözecek?','Same 5 puzzles. Two different minds. Who will solve them better?')}</p></div><button class="full" data-action="friends">${ft('Meydan okuma oluştur','Create a challenge')} →</button></section><details class="card home-help"><summary>${ft('Yıldızlar nasıl kazanılır?','How do I earn stars?')}</summary><p>${ft('Mantık ve şekil oyunlarında ipucusuz, kusursuz çözümler 3 yıldız kazandırır. Yanlış seçim, geri alma veya ipucu puanı azaltabilir. Ne Değişti’de Tekrar bak kullanmak 1 yıldız getirir. Dünyayı Keşfet’te her doğru cevap 3 yıldızdır. En iyi yıldızların saklanır.','Perfect, unaided solves earn 3 stars in logic and shape games. Wrong picks, undo or hints can reduce stars. Look again earns 1 star in Spot the Change. Each correct World Quest answer earns 3 stars. Your best stars are saved.')}</p><small>${ft('Önceden tamamlanan bölümleri tekrar oynayarak yıldız kazanabilirsin.','Replay previously completed levels to earn stars.')}</small></details><p class="footer">${t('footer')}</p>${storageNote()}`;};
const questAct=act;act=function(action,index,card,chosenLang){if(['classicHome','triviaHome','triviaStart','triviaFriends'].includes(action)){clearMemoryTimer();if(friendRun)saveFriends();friendRun=null;friendOpponent=null;if(action==='classicHome')renderClassicHome();else if(action==='triviaHome')renderTriviaHome();else if(action==='triviaStart'){startTrivia(card);}else if(action==='triviaFriends'){friendDraftDifficulty='trivia';questAct('friends');}return;}if(action==='triviaPick'){pickTrivia(index);return;}if(action==='triviaNext'){triviaNext();return;}if(action==='triviaRestart'){startTrivia(triviaRun.category);return;}questAct(action,index,card,chosenLang);};



const navigationAct=act;act=function(...args){const before=screen;navigationAct(...args);if(screen!==before||['continue','open','ruleOpen','ruleNext','next','memoryOpen','memoryNext','friendPlay','friendNext','friendResume','triviaStart','triviaNext','triviaRestart','daily'].includes(args[0]))window.scrollTo?.({top:0,behavior:'instant'});};

redraw();
openChallenge();
</script></body></html>
