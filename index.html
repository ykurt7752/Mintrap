ce.'),max:pair('Hamle sınırı','Move limit'),lamp:pair('Işık','Lamp'),on:pair('Açık','On'),off:pair('Kapalı','Off'),switch:pair('Anahtar','Switch'),target:pair('Hedef','Target'),start:pair('Başlangıç','Start'),move:pair('Hamle','Move'),check:pair('Sıralamayı kontrol et','Check order'),ready:pair('Düşünmek için zamanın var. Denemeye başlayabilirsin.','Take your time. Try an idea.'),success:pair('Çözüldü! Bağlantıyı buldun.','Solved! You found the connection.'),limit:pair('Hamle sınırına ulaştın. Geri alabilir veya baştan deneyebilirsin.','Move limit reached. Undo a move or restart.'),wrong:pair('Henüz bütün ipuçları sağlanmıyor. Kartları yeniden düzenle.','Some clues are not satisfied yet. Rearrange the cards.'),undo:pair('Geri al','Undo'),reset:pair('Baştan','Restart'),hint:pair('İpucu','Hint'),reveal:pair('Çözümü gör · spoiler','Reveal solution · spoiler'),logic:pair('Çözümün mantığı','Solution explained'),sample:pair('Bir çözüm','One solution'),spoilerNote:pair('Çözümü görmek bölümü tamamlamaz. Kendin uygulayabilirsin.','Revealing a solution does not complete the level. Try applying it yourself.'),next:pair('Sonraki bölüme geç','Next level'),finish:pair('Sonuçlarını gör','View results'),final:pair('20 bölüm tamamlandı!','All 20 levels completed!'),finalText:pair('Bağlantıları çözdün, ipuçlarını birleştirdin ve sınırlı hamleleri planladın. Yarın günlük devre için geri gelebilirsin.','You decoded connections, combined clues and planned limited moves. Come back for tomorrow’s daily circuit.'),footer:pair('Test için bütün bölümler açık. Reklam, ödeme ve veri gönderimi yok. İlerlemen yalnızca bu tarayıcıda saklanır; farklı cihazlara taşınmaz.','All levels are open for testing. No ads, payments or data transmission. Progress is stored only in this browser and does not sync across devices.'),storageFail:pair('Bu tarayıcı kayıt yapmaya izin vermiyor. Bu oturumda oynayabilirsin; ilerleme sayfa kapanınca kaybolabilir.','This browser does not allow saving. You can play, but p function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function previousDay(key){const [y,m,d]=key.split('-').map(Number);const value=new Date(Date.UTC(y,m-1,d-1));return value.toISOString().slice(0,10);}
function makeDaily(key){
 const n=6,masks=[3,6,12,24,48,32],combinations=[];
 for(let bits=1;bits<64;bits++){const indices=[];for(let i=0;i<6;i++)if(bits&(1<<i))indices.push(i);if(indices.length>=3&&indices.length<=5)combinations.push(indices);}

function act(action,index,card,chosenLang){
if(action==='lang'){lang=chosenLang==='en'?'en':'tr';persist();redraw();return;}
if(action==='rules'){screen='rules';renderRules();return;}if(action==='ruleOpen'){if(Number.isInteger(index)&&index>=0&&index<20)startRule(index);return;}if(action==='rulePick'){pickRule(index);return;}if(action==='ruleHint'){ruleHint=true;renderRuleGame();return;}if(action==='ruleReset'){startRule(ruleIndex);return;}if(action==='ruleNext'){if(ruleIndex<19)startRule(ruleIndex+1);else{screen='rules';renderRules();}return;}if(action==='home'){home();return;}if(action==='daily'){start('daily');return;}
if(action==='continue'){const next=levels.findIndex((_,i)=>!completed.includes(i));start(next<0?0:next);return;}
if(action==='open'){if(Number.isInteger(index)&&index>=0&&index<20)start(index);return;}
if(!state)return;const l=active();
if(action==='reset'){start(current);return;}if(action==='next'){if(current!=='daily'&&current<19)start(current+1);return;}if(action==='finish'){finish();return;}
if(action==='hint'){hints=Math.min(hints+1,l.hints.length);renderGame();return;}if(action==='reveal'){reveal=true;renderGame();return;}if(won)return;
notice='';noticeKind='';
if(action==='undo'){const h=state.history.pop();if(h){if(l.type==='order')state.cards=h.before;else state.value=h.before;}}
else if(action==='card'&&l.type==='order'&&l.items.includes(card)&&!state.cards.includes(card)){state.history.push({before:[...state.cards]});state.cards.push(card);}
else if(action==='remove'&&l.type==='order'&&state.cards[index]){state.history.push({before:[...state.cards]});state.cards.splice(index,1);}
else if(action==='check'&&l.type==='order'&&state.cards.length===l.items.length){if(l.rules.every(r=>checkRule(state.cards,r)))win();else{notice='wrong';noticeKind='warning';}}
else if((action==='switch'&&l.type==='light')||(action==='operation'&&l.type==='number')){const options=l.masks||l.ops;if(moveCount()>=l.max||!Number.isInteger(index)||index<0||index>=options.length)return;const before=state.value;state.value=l.type==='light'?before^l.masks[index]:l.ops[index][1](before);state.history.push({index,before,after:state.value});if(reached())win();else if(moveCount()===l.max){notice='limit';noticeKind='warning';}}
renderGame();}

const ruleLevels=[];
function rule(tr,en,htr,hen,test){ruleLevels.push({why:pair(tr,en),hint:pair(htr,hen),test});}
rule('En büyük şekli seç.','Choose the largest shape.','Boyutları karşılaştır.','Compare sizes.',(s,a)=>s.size===Math.max(...a.map(x=>x.size)));
rule('Köşesi olmayan şekli seç.','Choose the shape with no corners.','Kenar çizgisini izle.','Follow the outline.',s=>s.kind==='circle');

rule('Üç köşeli şekli seç.','Choose the three-cornered shape.','Köşeleri say.','Count corners.',s=>s.kind==='triangle');
rule('En küçük şekli seç.','Choose the smallest shape.','Büyük olmak her zaman avantaj değil.','Bigger is not always better.',(s,a)=>s.size===Math.min(...a.map(x=>x.size)));
rule('Tek başına farklı renkte olan şekli seç.','Choose the only shape with a different color.','Üç şeklin ortak özelliği ne?','What do three shapes share?',(s,a)=>a.filter(x=>x.color===s.color).length===1&&a.some(x=>a.filter(y=>y.color===x.color).length===3));
rule('En çok nokta içeren şekli seç.','Choose the shape with the most dots.','İçerideki işaretleri say.','Count the marks inside.',(s,a)=>s.dots===Math.max(...a.map(x=>x.dots)));
rule('Dört köşeli şekli seç.','Choose the four-cornered shape.','Yönü değişse de köşe sayısı aynı kalır.','Rotation does not change the corner count.',s=>s.kind==='square');
rule('Tam iki nokta içeren şekli seç.','Choose the shape with exactly two dots.','Daha çok, daha iyi demek değil.','More is not always better.',s=>s.dots===2);
rule('Diğer üçünden farklı biçimdeki şekli seç.','Choose the shape unlike the other three.','Rengi ve boyutu bir kenara bırak.','Set color and size aside.',(s,a)=>a.filter(x=>x.kind===s.kind).length===1&&a.some(x=>a.filter(y=>y.kind===x.kind).length===3));
rule('İçi dolu daireyi seç.','Choose the filled circle.','İki özelliği birlikte kontrol et.','Check two features together.',s=>s.kind==='circle'&&s.fill);
rule('İçi boş üçgeni seç.','Choose the hollow triangle.','Hem dış çizgi hem iç alan önemli.','Both outline and interior matter.',s=>s.kind==='triangle'&&!s.fill);
rule('Nokta sayısı köşe sayısına eşit olan şekli seç.','Choose the shape whose dots match its corners.','İçeriyi dışarıyla karşılaştır.','Compare inside with outside.',s=>s.dots===({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi dolu şekiller arasından en küçüğünü seç.','Choose the smallest filled shape.','Önce içi boş şekilleri ele.','First exclude hollow shapes.',(s,a)=>s.fill&&s.size===Math.min(...a.filter(x=>x.fill).map(x=>x.size)));
rule('Tek sayıda nokta içeren şekli seç.','Choose the shape with an odd number of dots.','Noktaları ikişer eşleştir.','Pair up the dots.',s=>s.dots%2===1);
rule('İçi boş şekiller arasından en büyüğünü seç.','Choose the largest hollow shape.','Önce dolu şekilleri ele.','First exclude filled shapes.',(s,a)=>!s.fill&&s.size===Math.max(...a.filter(x=>!x.fill).map(x=>x.size)));
rule('İkinci en büyük şekli seç.','Choose the second largest shape.','Boyutları sırala; ilkini atla.','Sort by size; skip the first.',(s,a)=>s.size===[...a].sort((x,y)=>y.size-x.size)[1].size);
rule('Noktası olmayan, içi dolu şekli seç.','Choose the filled shape with no dots.','İç alanın rengi ve işaretleri birlikte önemli.','Interior color and marks both matter.',s=>s.fill&&s.dots===0);
rule('Nokta sayısı köşe sayısından fazla olan şekli seç.','Choose the shape with more dots than corners.','İki sayıyı karşılaştır.','Compare two counts.',s=>s.dots>({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi boş, çift sayıda nokta içeren şekli seç. Sıfır da çifttir.','Choose the hollow shape with an even number of dots. Zero is even.','İki koşul var: dolgu ve sayı çiftliği.','Two conditions: fill and evenness.',s=>!s.fill&&s.dots%2===0);

const colorNames=[pair('Turkuaz','Teal'),pair('Mor','Purple'),pair('Sarı','Yellow'),pair('Pembe','Pink')];

function generateChoices(level,round){
 // Seeded rounds reproduce the same puzzle on restart without revealing the rule.
 let seed=(level+1)*98731+(round+1)*1237;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const int=n=>Math.floor(rand()*n);
 for(let attempt=0;attempt<10000;attempt++){
  const sizes=[38,52,66,80];for(let j=3;j>0;j--){const k=int(j+1);[sizes[j],sizes[k]]=[sizes[k],sizes[j]];}
  const a=sizes.map(size=>({size,kind:['circle','triangle','square','pentagon'][int(4)],color:int(4),fill:!!int(2),dots:int(6)}));
  if([0,4,13,15,16].includes(level)){const sameKind=a[0].kind;a.forEach(x=>x.kind=sameKind);}
  if(level===5||level===9){const field=level===5?'color':'kind';const common=a[0][field];a.forEach(x=>x[field]=common);const k=int(4);a[k][field]=field==='color'?(common+1+int(3))%4:['circle','triangle','square','pentagon'].filter(x=>x!==common)[int(3)];}
  if([13,15].includes(level)&&a.filter(x=>x.fill===(level===13)).length<2)continue;
  if(level===6&&new Set(a.map(x=>x.dots)).size<3)continue;
  if(ruleLevels[level].test&&a.filter(x=>ruleLevels[level].test(x,a)).length===1)return a;
 }
 throw new Error('Cannot construct rule level '+level);
}
function shapeSvg(s){

 else{const n={triangle:3,square:4,pentagon:5}[s.kind],offset=s.kind==='square'?Math.PI/4:-Math.PI/2;const pts=Array.from({length:n},(_,i)=>{const a=offset+i*2*Math.PI/n;return (50+r*Math.cos(a))+','+(50+r*Math.sin(a));}).join(' ');outline=`<polygon points="${pts}"/>`;}
 const dots=Array.from({length:s.dots},(_,i)=>{const a=i*2*Math.PI/s.dots;return `<circle cx="${s.dots===1?50:50+6*Math.cos(a)}" cy="${s.dots===1?50:50+6*Math.sin(a)}" r="2.3" fill="${s.fill?'#101222':'#ffffff'}"/>`;}).join('');
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${s.fill?c:'none'}" stroke="${c}" stroke-width="3" stroke-linejoin="round">${outline}</g>${dots}</svg>`;
}

 if(ruleLevels[ruleIndex].test(ruleChoices[i],ruleChoices)){ruleRound++;ruleRejected=[];ruleMessage='correct';if(ruleRound===3){ruleWon=true;if(!ruleCompleted.includes(ruleIndex))ruleCompleted.push(ruleIndex);saveRules();}else ruleChoices=generateChoices(ruleIndex,ruleRound);}
 else{ruleRejected.push(i);ruleMessage='wrong';}renderRuleGame();}
function renderRuleGame(){screen='ruleGame';const l=ruleLevels[ruleIndex];app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="rules">← ${ruleLabel()}</button><small>${t('level')} ${ruleIndex+1} / 20</small></div><h2>${lang==='tr'?'Gizli Kural':'Hidden Rule'} ${ruleIndex+1}</h2><p>${lang==='tr'?'Kurala uyan şekli seç. Boyut, biçim, dolgu, renk veya noktalarda bir bağlantı ara.':'Choose the shape that follows the rule. Look for a connection in size, shape, fill, color or dots.'}</p><div class="row"><strong>${lang==='tr'?'Doğru tur':'Correct rounds'}: ${ruleRound} / 3</strong><small>${lang==='tr'?'Deneme':'Attempts'}: ${ruleAttempts}</small></div><div class="rule-results">${[0,1,2].map(i=>`<span class="${i<ruleRound?'passed':''}"></span>`).join('')}</div>${ruleWon?'':`<div class="shape-grid">${ruleChoices.map((s,i)=>`<button class="shape-choice ${ruleRejected.includes(i)?'rejected':''}" data-action="rulePick" data-index="${i}" aria-label="${i+1}: ${text(colorNames[s.color])}, ${text(shapeNames[s.kind])}, ${s.size}, ${s.dots} ${lang==='tr'?'nokta':'dots'}, ${s.fill?(lang==='tr'?'dolu':'filled'):(lang==='tr'?'boş':'hollow')}" ${ruleRejected.includes(i)?'disabled':''}>${shapeSvg(s)}<small>${text(colorNames[s.color])} · ${s.dots} ${lang==='tr'?'nokta':'dots'}</small></button>`).join('')}</div>`}<div class="status ${ruleMessage==='correct'?'good':''}" role="status" aria-live="polite">${ruleWon?(lang==='tr'?'Üç tur tamam! Kuralı keşfettin.':'Three rounds complete! You found the rule.'):ruleMessage==='correct'?(lang==='tr'?'Doğru! Şekiller değişti, kural aynı.':'Correct! New shapes, same rule.'):ruleMessage==='wrong'?(lang==='tr'?'Bu şekil kurala uymuyor. Başka bir özelliği karşılaştır.':'This shape does not follow the rule. Compare another feature.'):(lang==='tr'?'İlk seçimini yap ve geri bildirimden öğren.':'Make your first pick and learn from feedback.')}</div><div class="actions"><button data-action="ruleReset">↻ ${t('reset')}</button><button data-action="ruleHint" ${ruleHint||ruleWon?'disabled':''}>${t('hint')}</button></div>${ruleHint?`<div class="hint">${text(l.hint)}</div>`:''}${ruleWon?`<div class="solution"><strong>${t('logic')}</strong><p>${text(l.why)}</p></div><button class="primary full" data-action="ruleNext">${ruleIndex===19?(lang==='tr'?'Bölümlere dön':'Back to levels'):t('next')} →</button>`:''}${storageNote()}`;}

redraw();
</script></body></html>
