 completed=validIds(saved?saved.completed:old);
 if(saved){lang=saved.lang==='en'?'en':'tr';dailyDone=saved.dailyDone&&typeof saved.dailyDone==='object'&&!Array.isArray(saved.dailyDone)?saved.dailyDone:{};streak=Number.isInteger(saved.streak)&&saved.streak>=0?saved.streak:0;lastDaily=typeof saved.lastDaily==='string'?saved.lastDaily:'';}

function persist(){try{localStorage.setItem('mindtrap-v02',JSON.stringify({lang,completed,dailyDone,streak,lastDaily}));}catch(e){storageOK=false;}}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function previousDay(key){const [y,m,d]=key.split('-').map(Number);const value=new Date(Date.UTC(y,m-1,d-1));return value.toISOString().slice(0,10);}
function makeDaily(key){
 const n=6,masks=[3,6,12,24,48,32],combinations=[];
 for(let bits=1;bits<64;bits++){const indices=[];for(let i=0;i<6;i++)if(bits&(1<<i))indices.push(i);if(indices.length>=3&&indices.length<=5)combinations.push(indices);}
 const [year,month,day]=key.split('-').map(Number);
 const ordinal=Math.floor(Date.UTC(year,month-1,day)/86400000);
 const solution=combinations[((ordinal*17)%combinations.length+combinations.length)%combinations.length];
 let start=63;for(const i of solution)start^=masks[i];
 return {type:'light',title:pair('Günün Devresi','Circuit of the Day'),n,start,masks,solution,max:solution.length,date:key,hints:[pair('Sol uçtan başlayıp ışıkların bağlantılarını takip et.','Start at the left and follow the connections.'),pair('İlk gerekli anahtar: '+(solution[0]+1)+'.','The first required switch is '+(solution[0]+1)+'.')],why:pair('Bir anahtarın iki kez kullanılması birbirini iptal eder. Gerekli anahtarları bul; sıranın önemi yok.','Using a switch twice cancels its effect. Find the required switches; their order does not matter.')};
}
function active(){return current==='daily'?activeDaily:levels[current];}
function kind(l){return t(l.type);}
function difficulty(i){return i<3?t('warm'):i<6?t('medium'):i<10?t('hard'):t('deep');}
function checkRule(p,r){if(r[0]==='before')return p.indexOf(r[1])<p.indexOf(r[2]);if(r[0]==='offset')return p.indexOf(r[2])-p.indexOf(r[1])===r[3];return p.indexOf(r[1])===r[2]-1;}
function clue(r){if(r[0]==='before')return lang==='tr'?`${r[1]}, ${r[2]}’den önce.`:`${r[1]} is before ${r[2]}.`;if(r[0]==='pos')return lang==='tr'?`${r[1]}, ${r[2]}. sırada.`:`${r[1]} is in position ${r[2]}.`;return lang==='tr'?`${r[2]}, ${r[1]}’${r[1]==='A'?'dan':'den'} ${r[3]===1?'hemen sonra':r[3]+' sıra sonra (arada '+(r[3]-1)+' kart)'}.`:`${r[2]} is ${r[3]===1?'immediately after '+r[1]:r[3]+' positions after '+r[1]+' ('+(r[3]-1)+' card in between)'}.`;}

function redraw(){document.documentElement.lang=lang;document.title='MindTrap — '+t('subtitle');if(screen==='freshHome')renderFreshHome();else if(screen==='freshGame')renderFreshGame();else if(screen==='freshResult')renderFreshResult();else if(screen==='classicHome')renderClassicHome();else if(screen==='triviaHome')renderTriviaHome();else if(screen==='triviaGame')renderTriviaGame();else if(screen==='triviaResult')renderTriviaResult();else if(screen==='memoryHome')renderMemoryHome();else if(screen==='memoryGame')renderMemoryGame();else if(screen==='friends')renderFriends();else if(screen==='friendLobby')renderFriendLobby();else if(screen==='friendResult')renderFriendResult();else if(screen==='rules')renderRules();else if(screen==='ruleGame')renderRuleGame();else if(screen==='home')renderHome();else if(screen==='game')renderGame();else renderFinish();}
function act(action,index,card,chosenLang){
if(action==='lang'){lang=chosenLang==='en'?'en':'tr';persist();redraw();return;}
if(action==='rules'){screen='rules';renderRules();return;}if(action==='ruleOpen'){if(Number.isInteger(index)&&index>=0&&index<ruleLevels.length)startRule(index);return;}if(action==='rulePick'){pickRule(index);return;}if(action==='ruleHint'){ruleHint=true;renderRuleGame();return;}if(action==='ruleReset'){startRule(ruleIndex);return;}if(action==='ruleNext'){if(ruleIndex<ruleLevels.length-1)startRule(ruleIndex+1);else{screen='rules';renderRules();}return;}if(action==='home'){home();return;}if(action==='daily'){start('daily');return;}
if(action==='continue'){const next=levels.findIndex((_,i)=>!completed.includes(i));start(next<0?0:next);return;}
if(action==='open'){if(Number.isInteger(index)&&index>=0&&index<20)start(index);return;}
if(!state)return;const l=active();
if(action==='reset'){start(current);return;}if(action==='next'){if(current!=='daily'&&current<19)start(current+1);return;}if(action==='finish'){finish();return;}
if(action==='hint'){hints=Math.min(hints+1,l.hints.length);renderGame();return;}if(action==='reveal'){reveal=true;renderGame();return;}if(won)return;
notice='';noticeKind='';
if(action==='undo'){const h=state.history.pop();if(h){if(l.type==='order')state.cards=h.before;else state.value=h.before;}}
else if(action==='card'&&l.type==='order'&&l.items.includes(card)&&!state.cards.includes(card)){state.history.push({before:[...state.cards]});state.cards.push(card);}
else if(action==='remove'&&l.type==='order'&&state.cards[index]){state.history.push({before:[...state.cards]});state.cards.splice(index,1);}
else if(action==='check'&&l.type==='order'&&state.cards.length===l.items.length){if(l.rules.every(r=>checkRule(state.cards,r)))win();else{notice='wrong';noticeKind='warning';}}
else if((action==='switch'&&l.type==='light')||(action==='operation'&&l.type==='number')){const options=l.masks||l.ops;if(moveCount()>=l.max||!Number.isInteger(index)||index<0||index>=options.length)return;const before=state.value;state.value=l.type==='light'?before^l.masks[index]:l.ops[index][1](before);state.history.push({index,before,after:state.value});if(reached())win();else if(moveCount()===l.max){notice='limit';noticeKind='warning';}}
renderGame();}

function rule(tr,en,htr,hen,test){ruleLevels.push({why:pair(tr,en),hint:pair(htr,hen),test});}
rule('En büyük şekli seç.','Choose the largest shape.','Boyutları karşılaştır.','Compare sizes.',(s,a)=>s.size===Math.max(...a.map(x=>x.size)));
rule('Köşesi olmayan şekli seç.','Choose the shape with no corners.','Kenar çizgisini izle.','Follow the outline.',s=>s.kind==='circle');
rule('İçi boş şekli seç.','Choose the hollow shape.','Şeklin içine bak.','Look inside.',s=>!s.fill);
rule('Üç köşeli şekli seç.','Choose the three-cornered shape.','Köşeleri say.','Count corners.',s=>s.kind==='triangle');
rule('En küçük şekli seç.','Choose the smallest shape.','Büyük olmak her zaman avantaj değil.','Bigger is not always better.',(s,a)=>s.size===Math.min(...a.map(x=>x.size)));
rule('Tek başına farklı renkte olan şekli seç.','Choose the only shape with a different color.','Üç şeklin ortak özelliği ne?','What do three shapes share?',(s,a)=>a.filter(x=>x.color===s.color).length===1&&a.some(x=>a.filter(y=>y.color===x.color).length===3));
rule('En çok nokta içeren şekli seç.','Choose the shape with the most dots.','İçerideki işaretleri say.','Count the marks inside.',(s,a)=>s.dots===Math.max(...a.map(x=>x.dots)));
rule('Dört köşeli şekli seç.','Choose the four-cornered shape.','Yönü değişse de köşe sayısı aynı kalır.','Rotation does not change the corner count.',s=>s.kind==='square');
rule('Tam iki nokta içeren şekli seç.','Choose the shape with exactly two dots.','Daha çok, daha iyi demek değil.','More is not always better.',s=>s.dots===2);
rule('Diğer üçünden farklı biçimdeki şekli seç.','Choose the shape unlike the other three.','Rengi ve boyutu bir kenara bırak.','Set color and size aside.',(s,a)=>a.filter(x=>x.kind===s.kind).length===1&&a.some(x=>a.filter(y=>y.kind===x.kind).length===3));
rule('İçi dolu daireyi seç.','Choose the filled circle.','İki özelliği birlikte kontrol et.','Check two features together.',s=>s.kind==='circle'&&s.fill);
rule('İçi boş üçgeni seç.','Choose the hollow triangle.','Hem dış çizgi hem iç alan önemli.','Both outline and interior matter.',s=>s.kind==='triangle'&&!s.fill);
rule('Nokta sayısı köşe sayısına eşit olan şekli seç.','Choose the shape whose dots match its corners.','İçeriyi dışarıyla karşılaştır.','Compare inside with outside.',s=>s.dots===({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi dolu şekiller arasından en küçüğünü seç.','Choose the smallest filled shape.','Önce içi boş şekilleri ele.','First exclude hollow shapes.',(s,a)=>s.fill&&s.size===Math.min(...a.filter(x=>x.fill).map(x=>x.size)));
rule('Tek sayıda nokta içeren şekli seç.','Choose the shape with an odd number of dots.','Noktaları ikişer eşleştir.','Pair up the dots.',s=>s.dots%2===1);
rule('İçi boş şekiller arasından en büyüğünü seç.','Choose the largest hollow shape.','Önce dolu şekilleri ele.','First exclude filled shapes.',(s,a)=>!s.fill&&s.size===Math.max(...a.filter(x=>!x.fill).map(x=>x.size)));
rule('İkinci en büyük şekli seç.','Choose the second largest shape.','Boyutları sırala; ilkini atla.','Sort by size; skip the first.',(s,a)=>s.size===[...a].sort((x,y)=>y.size-x.size)[1].size);
rule('Noktası olmayan, içi dolu şekli seç.','Choose the filled shape with no dots.','İç alanın rengi ve işaretleri birlikte önemli.','Interior color and marks both matter.',s=>s.fill&&s.dots===0);
rule('Nokta sayısı köşe sayısından fazla olan şekli seç.','Choose the shape with more dots than corners.','İki sayıyı karşılaştır.','Compare two counts.',s=>s.dots>({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('İçi boş, çift sayıda nokta içeren şekli seç. Sıfır da çifttir.','Choose the hollow shape with an even number of dots. Zero is even.','İki koşul var: dolgu ve sayı çiftliği.','Two conditions: fill and evenness.',s=>!s.fill&&s.dots%2===0);

rule('Üç şekil doluysa boş olanı, üçü boşsa dolu olanı seç.','Choose the only shape with different fill.','Çoğunluğun tersini ara.','Look for the opposite of the majority.',(s,a)=>a.filter(x=>x.fill===s.fill).length===1);
rule('İkinci en küçük şekli seç.','Choose the second smallest shape.','En küçüğe aldanma; bir sıra yukarı çık.','Do not pick the smallest; move up one rank.',(s,a)=>s.size===[...a].sort((x,y)=>x.size-y.size)[1].size);
rule('Nokta sayısı diğer üçünden farklı olan şekli seç.','Choose the shape with a different dot count from the other three.','Noktaları tek tek değil, gruplar arasında karşılaştır.','Compare dot counts across the group.',(s,a)=>a.filter(x=>x.dots===s.dots).length===1&&a.some(x=>a.filter(y=>y.dots===x.dots).length===3));
rule('En az noktaya sahip dolu şekli seç.','Choose the filled shape with the fewest dots.','Önce dolgu, sonra sayı.','First fill, then count.',(s,a)=>s.fill&&s.dots===Math.min(...a.filter(x=>x.fill).map(x=>x.dots)));
rule('Köşe sayısı nokta sayısından bir fazla olan şekli seç.','Choose the shape with one more corner than dots.','Eşitlik arama; fark bir.','Look for a difference of one.',s=>({circle:0,triangle:3,square:4,pentagon:5})[s.kind]===s.dots+1);
rule('En büyük şekille aynı sayıda nokta içeren diğer şekli seç.','Choose the other shape with as many dots as the largest shape.','En büyük şekil cevap değil, referans.','The largest shape is a reference.',(s,a)=>s.size!==Math.max(...a.map(x=>x.size))&&s.dots===a.find(x=>x.size===Math.max(...a.map(y=>y.size))).dots);
rule('En küçük şekille aynı renkte olan diğer şekli seç.','Choose the other shape with the same color as the smallest shape.','Küçük şekli bul, sonra renk eşini ara.','Find the smallest, then its color partner.',(s,a)=>s.size!==Math.min(...a.map(x=>x.size))&&s.color===a.find(x=>x.size===Math.min(...a.map(y=>y.size))).color);
rule('Nokta sayısı farklıysa en çok noktalıyı; eşitse en büyüğü seç.','Choose the most dots; break a tie by choosing the largest.','İki şekil eşitse boyut karar verir.','Size breaks a tie.',(s,a)=>s.dots===Math.max(...a.map(x=>x.dots))&&s.size===Math.max(...a.filter(x=>x.dots===s.dots).map(x=>x.size)));
rule('Nokta sayısı köşe sayısının yarısı olan şekli seç.','Choose the shape with half as many dots as corners.','Köşeleri ikişer eşleştir.','Pair up the corners.',s=>s.dots*2===({circle:0,triangle:3,square:4,pentagon:5})[s.kind]);
rule('En büyük ve en küçük şekli ele; kalan iki şekilden daha çok noktalıyı seç.','Discard the largest and smallest; choose more dots among the remaining two.','Uçları ele, ortadakileri karşılaştır.','Remove the extremes, compare the middle.',(s,a)=>{const mid=[...a].sort((x,y)=>x.size-y.size).slice(1,3);return mid.includes(s)&&s.dots===Math.max(...mid.map(x=>x.dots));});

try{const a=JSON.parse(localStorage.getItem('mindtrap-rules-v1')||'[]');if(Array.isArray(a))ruleCompleted=[...new Set(a.filter(n=>Number.isInteger(n)&&n>=0&&n<ruleLevels.length))];}catch(e){}
let ruleIndex=0,ruleRound=0,ruleAttempts=0,ruleHint=false,ruleWon=false,ruleChoices=[],ruleRejected=[],ruleMessage='';

function ruleLabel(){return lang==='tr'?'Kuralı Bul':'Find the Rule';}
const shapeNames={circle:pair('Daire','Circle'),triangle:pair('Üçgen','Triangle'),square:pair('Kare','Square'),pentagon:pair('Beşgen','Pentagon')};
const colorNames=[pair('Turkuaz','Teal'),pair('Mor','Purple'),pair('Sarı','Yellow'),pair('Pembe','Pink')];
const shapeColors=['#92efd2','#bcaaff','#ffd27b','#ff91ba'];
function generateChoices(level,round){
 // Seeded rounds reproduce the same puzzle on restart without revealing the rule.
 let seed=(level+1)*98731+(round+1)*1237;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const int=n=>Math.floor(rand()*n);
 for(let attempt=0;attempt<10000;attempt++){
  const sizes=[38,52,66,80];for(let j=3;j>0;j--){const k=int(j+1);[sizes[j],sizes[k]]=[sizes[k],sizes[j]];}
  const a=sizes.map(size=>({size,kind:['circle','triangle','square','pentagon'][int(4)],color:int(4),fill:!!int(2),dots:int(6)}));
  if([0,4,13,15,16,21,25,26,27,29].includes(level)){const sameKind=a[0].kind;a.forEach(x=>x.kind=sameKind);}
  if(level===5||level===9){const field=level===5?'color':'kind';const common=a[0][field];a.forEach(x=>x[field]=common);const k=int(4);a[k][field]=field==='color'?(common+1+int(3))%4:['circle','triangle','square','pentagon'].filter(x=>x!==common)[int(3)];}
  if(level===22){const common=int(6);a.forEach(x=>x.dots=common);a[int(4)].dots=(common+1+int(5))%6;}
  if(level===27){const low=[...a].sort((x,y)=>x.size-y.size);low[0].dots=1;low[1].dots=2;low[2].dots=4;low[3].dots=4;}
  if(level===29&&new Set([...a].sort((x,y)=>x.size-y.size).slice(1,3).map(x=>x.dots)).size!==2)continue;
  if(level===23&&a.filter(x=>x.fill).length<2)continue;
  if([13,15].includes(level)&&a.filter(x=>x.fill===(level===13)).length<2)continue;
  if(level===6&&new Set(a.map(x=>x.dots)).size<3)continue;
  if(ruleLevels[level].test&&a.filter(x=>ruleLevels[level].test(x,a)).length===1)return a;
 }
 throw new Error('Cannot construct rule level '+level);
}
function shapeSvg(s){
 const r=s.size/2,c=shapeColors[s.color];let outline='';
 if(s.kind==='circle')outline=`<circle cx="50" cy="50" r="${r}"/>`;
 else{const n={triangle:3,square:4,pentagon:5}[s.kind],offset=s.kind==='square'?Math.PI/4:-Math.PI/2;const pts=Array.from({length:n},(_,i)=>{const a=offset+i*2*Math.PI/n;return (50+r*Math.cos(a))+','+(50+r*Math.sin(a));}).join(' ');outline=`<polygon points="${pts}"/>`;}
 const dots=Array.from({length:s.dots},(_,i)=>{const a=i*2*Math.PI/s.dots;return `<circle cx="${s.dots===1?50:50+6*Math.cos(a)}" cy="${s.dots===1?50:50+6*Math.sin(a)}" r="2.3" fill="${s.fill?'#101222':'#ffffff'}"/>`;}).join('');
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${s.fill?c:'none'}" stroke="${c}" stroke-width="3" stroke-linejoin="round">${outline}</g>${dots}</svg>`;
}
function renderRules(){screen='rules';app.innerHTML=header()+`<button class="secondary" data-action="home">← ${lang==='tr'?'Ana ekran':'Home'}</button><section class="card hero"><div class="eyebrow">${ruleLevels.length} ${t('levels')}</div><h1>${ruleLabel()}</h1><p>${lang==='tr'?'Her bölümde dört şekilden yalnızca biri gizli kurala uyar. Seçim yap, geri bildirimden öğren ve aynı kuralı üç farklı turda uygula. Kural bölüm boyunca değişmez.':'In each level, only one of four shapes follows a hidden rule. Choose, learn from feedback and apply the same rule in three rounds. The rule stays the same throughout the level.'}</p><p class="rule-note">${lang==='tr'?'Yanlış seçimde can kaybetmezsin. İpucu isteyebilirsin; kural üçüncü doğru seçimden sonra açıklanır.':'Wrong picks cost no lives. Hints are available; the rule is revealed after your third correct pick.'}</p><button class="primary full" data-action="ruleOpen" data-index="${ruleLevels.findIndex((_,i)=>!ruleCompleted.includes(i))<0?0:ruleLevels.findIndex((_,i)=>!ruleCompleted.includes(i))}">${t('continue')} →</button></section><div class="row"><strong>${t('levels')}</strong><small>${ruleCompleted.length} / ${ruleLevels.length} ${t('done')}</small></div><div class="progress"><div style="width:${ruleCompleted.length*100/ruleLevels.length}%"></div></div><div class="level-grid">${ruleLevels.map((_,i)=>`<button class="level-button ${ruleCompleted.includes(i)?'complete':''}" data-action="ruleOpen" data-index="${i}"><span>${ruleCompleted.includes(i)?'✓':'◇'} ${String(i+1).padStart(2,'0')}</span><strong>${lang==='tr'?'Gizli Kural':'Hidden Rule'} ${i+1}</strong><small>${i>=20?(lang==='tr'?'Yeni · Ters Köşe':'New · Twist'):i<5?t('warm'):i<10?t('medium'):t('hard')}</small></button>`).join('')}</div>${storageNote()}`;}
function startRule(i){screen='ruleGame';state=null;ruleIndex=i;ruleRound=0;ruleAttempts=0;ruleHint=false;ruleWon=false;ruleRejected=[];ruleMessage='';ruleChoices=generateChoices(i,0);renderRuleGame();}
function pickRule(i){if(screen!=='ruleGame'||ruleWon||!Number.isInteger(i)||!ruleChoices[i]||ruleRejected.includes(i))return;ruleAttempts++;
 if(ruleLevels[ruleIndex].test(ruleChoices[i],ruleChoices)){ruleRound++;ruleRejected=[];ruleMessage='correct';if(ruleRound===3){ruleWon=true;if(!ruleCompleted.includes(ruleIndex))ruleCompleted.push(ruleIndex);saveRules();}else ruleChoices=generateChoices(ruleIndex,ruleRound);}
 else{ruleRejected.push(i);ruleMessage='wrong';}renderRuleGame();}
function renderRuleGame(){screen='ruleGame';const l=ruleLevels[ruleIndex];app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="rules">← ${ruleLabel()}</button><small>${t('level')} ${ruleIndex+1} / ${ruleLevels.length}</small></div><h2>${lang==='tr'?'Gizli Kural':'Hidden Rule'} ${ruleIndex+1}</h2><p>${lang==='tr'?'Kurala uyan şekli seç. Boyut, biçim, dolgu, renk veya noktalarda bir bağlantı ara.':'Choose the shape that follows the rule. Look for a connection in size, shape, fill, color or dots.'}</p><div class="row"><strong>${lang==='tr'?'Doğru tur':'Correct rounds'}: ${ruleRound} / 3</strong><small>${lang==='tr'?'Deneme':'Attempts'}: ${ruleAttempts}</small></div><div class="rule-results">${[0,1,2].map(i=>`<span class="${i<ruleRound?'passed':''}"></span>`).join('')}</div>${ruleWon?'':`<div class="shape-grid">${ruleChoices.map((s,i)=>`<button class="shape-choice ${ruleRejected.includes(i)?'rejected':''}" data-action="rulePick" data-index="${i}" aria-label="${i+1}: ${text(colorNames[s.color])}, ${text(shapeNames[s.kind])}, ${s.size}, ${s.dots} ${lang==='tr'?'nokta':'dots'}, ${s.fill?(lang==='tr'?'dolu':'filled'):(lang==='tr'?'boş':'hollow')}" ${ruleRejected.includes(i)?'disabled':''}>${shapeSvg(s)}<small>${text(colorNames[s.color])} · ${s.dots} ${lang==='tr'?'nokta':'dots'}</small></button>`).join('')}</div>`}<div class="status ${ruleMessage==='correct'?'good':''}" role="status" aria-live="polite">${ruleWon?(lang==='tr'?'Üç tur tamam! Kuralı keşfettin.':'Three rounds complete! You found the rule.'):ruleMessage==='correct'?(lang==='tr'?'Doğru! Şekiller değişti, kural aynı.':'Correct! New shapes, same rule.'):ruleMessage==='wrong'?(lang==='tr'?'Bu şekil kurala uymuyor. Başka bir özelliği karşılaştır.':'This shape does not follow the rule. Compare another feature.'):(lang==='tr'?'İlk seçimini yap ve geri bildirimden öğren.':'Make your first pick and learn from feedback.')}</div><div class="actions"><button data-action="ruleReset">↻ ${t('reset')}</button><button data-action="ruleHint" ${ruleHint||ruleWon?'disabled':''}>${t('hint')}</button></div>${ruleHint?`<div class="hint">${text(l.hint)}</div>`:''}${ruleWon?`<div class="solution"><strong>${t('logic')}</strong><p>${text(l.why)}</p></div><button class="primary full" data-action="${friendRun?'friendNext':'ruleNext'}">${friendRun?(lang==='tr'?'Meydan okumaya devam':'Continue challenge'):ruleIndex===ruleLevels.length-1?(lang==='tr'?'Bölümlere dön':'Back to levels'):t('next')} →</button>`:''}${storageNote()}`;}

let triviaRun=null,triviaAnswered=false,triviaChoices=[];let triviaHistory={};
try{const data=JSON.parse(localStorage.getItem('mindtrap-trivia-v07')||'{}');if(data&&typeof data==='object'&&!Array.isArray(data))for(const [k,v]of Object.entries(data))if(/^\d{1,2}$/.test(k)&&Number(k)<30&&v&&typeof v.correct==='boolean')triviaHistory[k]={correct:v.correct};}catch(e){}
function triviaTitle(){return ft('Dünyayı Keşfet','World Quest');}
function categoryTitle(c){return c==='cities'?ft('Şehirler','Cities'):c==='countries'?ft('Ülkeler','Countries'):c==='world'?ft('Dünya','World'):ft('Karışık','Mixed');}
function shuffleWithSeed(items,seed){const a=[...items];let v=seed>>>0;for(let i=a.length-1;i>0;i--){v=(Math.imul(v,1664525)+1013904223)>>>0;const j=v%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function triviaIds(category,seed){return shuffleWithSeed(triviaQuestions.filter(q=>category==='mix'||q.category===category).map(q=>q.id),seed).slice(0,5);}
function saveTrivia(){try{localStorage.setItem('mindtrap-trivia-v07',JSON.stringify(triviaHistory));}catch(e){storageOK=false;}}
function currentTrivia(){return triviaQuestions[triviaRun.ids[triviaRun.index]];}
function loadTriviaQuestion(){triviaAnswered=false;triviaChoices=shuffleWithSeed([0,1,2,3],triviaRun.seed+currentTrivia().id*987+triviaRun.index*37);screen='triviaGame';state=null;renderTriviaGame();}
function startTrivia(category){if(!['cities','countries','world','mix'].includes(category))return;const seed=Math.floor(Math.random()*1000000000)+1;triviaRun={category,seed,ids:triviaIds(category,seed),index:0,answers:[]};loadTriviaQuestion();}
function startFriendTrivia(){triviaRun={category:'mix',seed:friendRun.seed,ids:friendIds(friendRun.seed,'trivia'),index:friendRun.scores.length,answers:[]};loadTriviaQuestion();}
function pickTrivia(i){if(screen!=='triviaGame'||triviaAnswered||!Number.isInteger(i)||i<0||i>3)return;const q=currentTrivia(),correct=triviaChoices[i]===0;triviaAnswered=true;triviaRun.answers.push({id:q.id,chosen:triviaChoices[i],correct});triviaHistory[q.id]={correct:correct||!!triviaHistory[q.id]?.correct};if(correct)recordRun('trivia:'+q.id,3,1);saveTrivia();if(friendRun&&friendRun.difficulty==='trivia'&&friendRun.scores.length===triviaRun.index){friendRun.scores.push({stars:correct?3:0,attempts:1});saveFriends();}renderTriviaGame();}
function triviaNext(){if(!triviaAnswered)return;if(friendRun){advanceFriend();return;}if(triviaRun.index<4){triviaRun.index++;loadTriviaQuestion();}else renderTriviaResult();}
function renderTriviaHome(){screen='triviaHome';state=null;app.innerHTML=header()+`<button class="secondary" data-action="home">← ${ft('Ana ekran','Home')}</button><section class="card hero"><div class="eyebrow">WORLD QUEST · TR / EN</div><div class="quest-hero-icon">${modeIcon('trivia')}</div><h1>${triviaTitle()}</h1><p>${ft('Şehirlerden ülkelere, okyanuslardan dağlara. Her tur 5 soru, her soruda 4 seçenek. Cevabını seç, yeni bir bilgi öğren.','From cities to countries, oceans to mountains. Five questions per round, four choices per question. Choose an answer and discover a new fact.')}</p><div class="tags"><span>30 ${ft('soru','questions')}</span><span>${ft('Süre baskısı yok','No timer')}</span><span>${Object.values(triviaHistory).filter(x=>x.correct).length}/30 ${ft('öğrenildi','mastered')}</span></div><button class="primary full" data-action="triviaStart" data-card="mix">${ft('Karışık tur oyna','Play a mixed round')} →</button><button class="full" data-action="triviaFriends">${friendTitle()} →</button></section><div class="quest-categories">${['cities','countries','world'].map(c=>`<button class="category-card" data-action="triviaStart" data-card="${c}"><span>${c==='cities'?'⌂':c==='countries'?'⚑':'◎'}</span><strong>${categoryTitle(c)}</strong><small>10 ${ft('soru','questions')} · 5 ${ft('soruluk tur','per round')}</small></button>`).join('')}</div><section class="card"><p class="rule-note">${ft('Her soru için tek cevap hakkın var. Her doğru cevap 3 yıldız getirir. Açıklamalar ve kaynak bağlantıları cevap verdikten sonra görünür.','You get one answer per question. Each correct answer earns 3 stars. Explanations and source links appear after you answer.')}</p><small>${ft('Sorular UNESCO, NOAA, NASA ve ilgili kurumların kaynaklarıyla kontrol edildi.','Questions were checked against UNESCO, NOAA, NASA and other institutional sources.')}</small></section>${storageNote()}`;}
function renderTriviaGame(){screen='triviaGame';const q=currentTrivia(),answer=triviaRun.answers.find(a=>a.id===q.id);app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="${friendRun?'friendLobby':'triviaHome'}">← ${friendRun?friendTitle():triviaTitle()}</button><small>${ft('Soru','Question')} ${triviaRun.index+1} / 5</small></div><div class="progress"><div style="width:${(triviaRun.index+(triviaAnswered?1:0))*20}%"></div></div><div class="eyebrow">${categoryTitle(q.category)} · WORLD QUEST</div><section class="card quiz-card">${q.flag?'<svg class="japan-flag" viewBox="0 0 150 100" role="img" aria-label="'+ft('Beyaz zemin üzerinde kırmızı daire','Red circle on a white background')+'"><rect width="150" height="100" fill="white" rx="5"/><circle cx="75" cy="50" r="30" fill="#bc002d"/></svg>':`<div class="quiz-symbol" aria-hidden="true">${modeIcon('trivia')}</div>`}<h2>${text(q.question)}</h2><div class="quiz-options">${triviaChoices.map((option,i)=>`<button class="quiz-option ${triviaAnswered?(option===0?'quiz-correct':option===answer?.chosen?'quiz-wrong':''):''}" data-action="triviaPick" data-index="${i}" ${triviaAnswered?'disabled':''}><span>${String.fromCharCode(65+i)}</span><strong>${text(q.options[option])}</strong>${triviaAnswered&&option===0?'<span aria-label="'+ft('Doğru cevap','Correct answer')+'">✓</span>':''}</button>`).join('')}</div></section>${triviaAnswered?`<div class="solution"><strong role="status">${answer?.correct?ft('Doğru! +3 ★','Correct! +3 ★'):ft('Yeni bir bilgi öğrendin.','You learned something new.')}</strong><p>${text(q.fact)}</p><a href="${q.url}" target="_blank" rel="noopener noreferrer">${ft('Kaynağı incele','Read the source')} ↗</a></div><button class="primary full" data-action="triviaNext">${triviaRun.index===4?ft('Sonuçları gör','View results'):ft('Sonraki soru','Next question')} →</button>`:`<p class="rule-note" role="status">${ft('Tek cevap hakkın var. Süre sınırı yok.','One answer per question. No time limi function renderTriviaResult(){screen='triviaResult';const correct=triviaRun.answers.filter(a=>a.correct).length;app.innerHTML=header()+`<section class="card hero"><div class="eyebrow">WORLD QUEST · ${categoryTitle(triviaRun.category)}</div><h1>${ft('Keşif tamamlandı!','Quest complete!')}</h1><div class="quiz-total">${correct}<small> / 5</small></div><p class="stars">${correct*3} / 15 ★</p><p>${ft('Her cevap, dünyaya açılan yeni bir pencere.','Every answer opens another window onto the world.')}</p><button class="primary full" data-action="triviaRestart">${ft('Yeni 5 soru','Another 5 questions')} →</button><button class="full" data-action="triviaFriends">${friendTitle()} →</button><button class="secondary full" data-action="triviaHome">${ft('Kategoriler','Categories')}</button></section>${triviaRun.answers.map(a=>{const q=triviaQuestions[a.id];return `<details class="card"><summary>${a.correct?'✓':'○'} ${text(q.question)}</summary><p><strong>${text(q.options[0])}</strong> · ${text(q.fact)}</p><a href="${q.url}" target="_blank" rel="noopener noreferrer">${ft('Kaynak','Source')} ↗</a></details>`;}).join('')}${storageNote()}`;}

function renderFreshGame(){screen='freshGame';const mode=freshRun.mode,q=activeFresh();let panel='';if(mode==='logic')panel=logicVisual(q);if(mode==='detective')panel=`<div class="clue-options">${freshAux.map((raw,i)=>`<button data-action="freshExtra" data-index="${raw}" class="${freshExtra===raw?'picked':''}" ${freshAnswered?'disabled':''}><span>${i+1}</span>${text(q.clues[raw])}</button>`).join('')}</div>`;if(mode==='market')panel=`<div class="hint-market"><p>${ft('İlk ipucu','Starting clue')}: ${text(q.region)}</p><div class="actions">${[0,1,2].map(i=>`<button data-action="freshHint" data-index="${i}" ${freshAnswered||freshHints.includes(i)?'disabled':''}>${i===0?ft('Yemek','Dish'):i===1?ft('Silüet','Silhouette'):ft('Yapı ipucu','Landmark clue')} · ${freshHints.length>=2?ft('Ücretsiz','Free'):'−1 ★'}</button>`).join('')}</div>${freshHints.map(i=>`<div class="hint">${i===1?landmarkSvg(q.id):''}${text(q.hints[i])}</div>`).join('')}<small>${ft('Kazanılabilecek yıldız','Available stars')}: ${Math.max(1,3-freshHints.length)} ★</small></div>`;if(mode==='connections')panel=`<div class="connection-cards">${freshAux.map((raw,i)=>`<button data-action="freshExtra" data-index="${raw}" ${freshAnswered||q.id<5?'disabled':''} class="${freshExtra===raw?'picked':''}"><small>${i+1}</small><span>${raw===0?'⌂':raw===1?'♨':'◇'}</span><strong>${text(connectionCards(q)[raw])}</strong></button>`).join('')}</div>`;

 const canSubmit=freshSelected!==null&&(mode!=='detective'&&!(mode==='connections'&&q.id>=5)||freshExtra!==null);app.innerHTML=header()+`<div class="row"><button class="secondary" data-action="${friendRun?'friendLobby':'freshBack'}">← ${friendRun?friendTitle():ft('Oyun menüsü','Mode menu')}</button><small>${freshRun.index+1} / ${freshRun.ids.length}</small></div><div class="progress"><div style="width:${(freshRun.index+(freshAnswered?1:0))*100/freshRun.ids.length}%"></div></div><div class="eyebrow">${freshTitle(mode)}${mode==='logic'?' · '+diffName(freshRun.difficulty)+' · '+logicTypeName(q.type):''}</div><h2>${mode==='coop'?ft('Ortak hedef kartınız hangisi?','Which card is your shared target?'):text(q.question)}</h2>${mode==='detective'?`<p class="rule-note">${ft('Önce yanlış olduğunu düşündüğün ipucuna dokun; sonra ülkeyi seç.','Tap the clue you think is false, then choose a country.')}</p>`:''}${panel}${mode!=='coop'?`<div class="quiz-options">${freshChoices.map((raw,i)=>`<button class="quiz-option ${freshSelected===raw?'picked':''} ${freshAnswered&&raw===0?'quiz-correct':''}" data-action="freshChoice" data-index="${raw}" ${freshAnswered?'disabled':''}><span>${String.fromCharCode(65+i)}</span><strong>${text(q.options[raw])}</strong></button>`).join('')}</div>`:''}${mode==='confidence'?`<div class="confidence-picker"><p>${ft('Ne kadar eminsin?','How sure are you?')}</p><div class="actions">${[1,2,3].map(i=>`<button data-action="freshConfidence" data-index="${i}" class="${freshConfidence===i?'picked':''}" ${freshAnswered?'disabled':''}>${i===1?ft('Bir tahmin','A guess'):i===2?ft('Oldukça emin','Fairly sure'):ft('Çok emin','Very sure')}<small> ±${i} ${ft('puan','points')}</small></button>`).join('')}</div></div>`:''}${freshAnswered?`<div class="solution" role="status">${mode==='coop'?`<strong>${ft('Seçimin kaydedildi.','Your choice is saved.')}</strong><p>${ft('Cevap, iki rolün sonuçları birleştirildiğinde açıklanacak.','The answer will be revealed when both roles’ results are combined.')}</p>`:`<strong>${freshFeedback.correct?ft('Doğru!','Correct!'):ft('Çözümü birlikte inceleyelim.','Let’s review the solution.')}</strong><p class="stars">${mode==='confidence'?(freshFeedback.points>0?'+':'')+freshFeedback.points+' '+ft('puan','points'):starsText(freshFeedback.stars)}</p><p>${text(q.fact)}</p>${mode==='connections'&&q.id>=5?`<p>${ft('İlgisiz kart','Unrelated card')}: ${text(connectionCards(q)[3])}</p>`:''}${mode==='detective'?`<p>${ft('Yanlış ipucu','False clue')}: ${text(q.clues[2])}</p>`:''}${freshSource(q)}`}</div><button class="primary full" data-action="freshNext">${freshRun.index===freshRun.ids.length-1?ft('Sonuçları gör','View results'):ft('Sonraki yeni soru','Next new question')} →</button>`:`<button class="primary full" data-action="freshSubmit" ${canSubmit?'':'disabled'}>${ft('Cevabımı kontrol et','Submit my answer')}</button>`}${friendRun?`<p class="rule-note">${escapeMarkup(friendRun.name)} · ${friendStats(friendRun.scores)}</p>`:''}${storageNote()}`;}
function submitFresh(){if(screen!=='freshGame'||freshAnswered||freshSelected===null)return;const mode=freshRun.mode,q=activeFresh();if((mode==='detective'||mode==='connections'&&q.id>=5)&&freshExtra===null)return;const correct=freshSelected===(mode==='coop'?coopPuzzle(q.id,freshRun.seed).target:0)&&(mode!=='detective'||freshExtra===2)&&(mode!=='connections'||q.id<5||freshExtra===3);const stars=correct?(mode==='confidence'?freshConfidence:mode==='market'?Math.max(1,3-freshHints.length):3):0;freshFeedback={id:q.id,stars,attempts:1,correct,guess:freshSelected,...(mode==='confidence'?{points:correct?freshConfidence:-freshConfidence}:{})};freshAnswered=true;freshRun.results.push(freshFeedback);if(correct&&mode!=='coop')recordRun(mode+':'+q.id,stars,1);if(friendRun&&friendRun.scores.length===freshRun.index){friendRun.scores.push({...freshFeedback});saveFriends();}renderFreshGame();}
function nextFresh(){if(!freshAnswered)return;if(friendRun){advanceFriend();return;}if(freshRun.index<freshRun.ids.length-1){freshRun.index++;loadFresh();}else renderFreshResult();}
function renderFreshResult(){screen='freshResult';state=null;const mode=freshRun.mode,score=freshRun.results.reduce((n,r)=>n+(mode==='confidence'?r.points:r.stars),0);app.innerHTML=header()+`<section class="card hero"><div class="eyebrow">${freshTitle(mode)}</div><h1>${ft('Tur tamamlandı!','Round complete!')}</h1><div class="quiz-total">${score}<small>${mode==='confidence'?' '+ft('puan','points'):' / '+freshRun.results.length*3+' ★'}</small></div><p>${freshRun.results.filter(r=>r.correct).length} / ${freshRun.results.length} ${ft('doğru','correct')}</p><button class="primary full" data-action="freshBack">${ft('Yeni sorulara geç','Find more new questions')} →</button><button class="full" data-action="freshInvite">${friendTitle()} →</button></section>${freshRun.results.map(r=>{const q=modeBanks[mode][r.id];return `<details class="card"><summary>${r.correct?'✓':'○'} ${mode==='logic'?logicTypeName(q.type):ft('Dosya','Case')+' '+(q.id+1)}</summary><p>${text(q.fact)}</p>${freshSource(q)}</details>`;}).join('')}${storageNote()}`;}
async function shareCoopHint(){const textToShare='MindTrap · '+ft('Soru','Question')+' '+(freshRun.index+1)+' · '+ft('Rol','Role')+' '+friendRun.role+'\n'+currentCoopHint();try{if(navigator.share)await navigator.share({title:'MindTrap · Clue Partners',text:textToShare});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(textToShare);freshHintShare=ft('İpucu kopyalandı.','Clue copied.');}else freshHintShare=ft('Yukarıdaki ipucunu arkadaşına mesajla iletebilirsin.','Send the clue above to your partner in a message.');}catch(e){if(e.name!=='AbortError')freshHintShare=ft('Yukarıdaki ipucunu arkadaşına mesajla iletebilirsin.','Send the clue above to your partner in a message.');}renderFreshGame();}
const freshPackMode=d=>d.startsWith('logic_')?'logic':newModeInfo[d]?d:null;
const freshBaseFriendIds=friendIds;friendIds=function(seed,difficulty){const mode=freshPackMode(difficulty);return mode?shuffleWithSeed(mode==='logic'?freshPool('logic',difficulty.slice(6)):modeBanks[mode].map(q=>q.id),seed).slice(0,5):freshBaseFriendIds(seed,difficulty);};
const freshBaseDiff=friendDifficulty;friendDifficulty=function(d){return d.startsWith('logic_')?freshTitle('logic')+' · '+diffName(d.slice(6)):newModeInfo[d]?freshTitle(d):freshBaseDiff(d);};
const freshBaseCreate=createFriend;createFriend=function(){freshBaseCreate();if(friendRun.difficulty==='coop'){friendRun.role='A';saveFriends();renderFriendLobby();}};
const freshBaseStartFriend=startFriendRound;startFriendRound=function(){const mode=freshPackMode(friendRun.difficulty);if(!mode){freshBaseStartFriend();return;}friendRun.name=cleanName(document.getElementById('friend-player-name')?.value)||friendRun.name||ft('Oyuncu','Player');if(friendRun.difficulty==='coop'&&!['A','B'].includes(friendRun.role))friendRun.role='A';saveFriends();if(friendRun.scores.length===5){renderFriendResult();return;}freshRun={mode,difficulty:friendRun.difficulty.startsWith('logic_')?friendRun.difficulty.slice(6):'easy',seed:friendRun.seed,ids:friendIds(friendRun.seed,friendRun.difficulty),index:friendRun.scores.length,results:[]};loadFresh();};
const freshBaseFriendUrl=friendUrl;friendUrl=function(result){const raw=freshBaseFriendUrl(result);if(!raw)return raw;const u=new URL(raw),q=new URLSearchParams(u.hash.slice(1));if(friendRun.difficulty==='coop'){q.set('role',friendRun.role||'A');if(result&&friendRun.scores.length===5)q.set('guesses',friendRun.scores.map(s=>s.guess).join(','));}if(result&&friendRun.difficulty==='confidence'&&friendRun.scores.length===5)q.set('points',friendRun.scores.map(s=>s.points).join(','));u.hash=q.toString();return u.href;};
const freshBaseStats=friendStats;friendStats=function(scores){return friendRun?.difficulty==='coop'?`${scores.length}/5 ${ft('seçim kaydedildi','choices saved')}`:friendRun?.difficulty==='confidence'?`${scores.reduce((n,r)=>n+r.points,0)} ${ft('puan','points')}`:freshPackMode(friendRun?.difficulty||'')?`${friendScoresTotal(scores).stars}/15 ★ · ${scores.length}/5`:freshBaseStats(scores);};
const freshBaseHelp=friendHelp;friendHelp=function(){const d=friendRun?.difficulty||friendDraftDifficulty;return d==='coop'?`<p class="rule-note">${freshInstruction('coop')} ${friendRun?ft('Senin rolün: ','Your role: ')+friendRun.role:''}</p>`:d==='confidence'?`<p class="rule-note">${freshInstruction('confidence')} ${ft('Kazanan toplam puanla belirlenir.','The total points determine the winner.')}</p>`:freshBaseHelp();};
const freshBaseFriendResult=renderFriendResult;renderFriendResult=function(){if(!['coop','confidence'].includes(friendRun.difficulty)){freshBaseFriendResult();return;}screen='friendResult';state=null;const coop=friendRun.difficulty==='coop',partnerReady=friendOpponent&&(!coop||friendOpponent.role!==friendRun.role);const myPoints=friendRun.scores.reduce((n,r)=>n+(r.points||0),0),theirPoints=partnerReady?friendOpponent.scores.reduce((n,r)=>n+(r.points||0),0):null;let joint=0;if(coop&&partnerReady)for(let i=0;i<5;i++)if(friendRun.scores[i].stars===3&&friendOpponent.scores[i].stars===3){joint+=3;recordRun('coop:'+friendIds(friendRun.seed,'coop')[i],3,1);}
 app.innerHTML=header()+`<button class="secondary" data-action="friends">← ${friendTitle()}</button><section class="card hero"><div class="eyebrow">${freshTitle(friendRun.difficulty)}</div><h1>${coop?ft('Takım sonuçları','Team results'):ft('Güven ve bilgi sonuçları','Confidence and knowledge results')}</h1><p>${escapeMarkup(friendRun.name)}${coop?' · '+ft('Rol','Role')+' '+friendRun.role:''}</p><div class="quiz-total">${coop?(partnerReady?joint:'—'):myPoints}<small>${coop?' / 15 ★':' '+ft('puan','points')}</small></div><p role="status">${!partnerReady?ft('Arkadaşının diğer rol / sonuç bağlantısını açınca karşılaştırma tamamlanır.','Open your partner’s other-role / result link to complete the comparison.'):coop?ft('İki rolün de doğru seçtiği kartlar takım puanına sayılır.','Only cards both roles chose correctly count toward the team score.'):myPoints===theirPoints?ft('Berabere!','A tie!'):myPoints>theirPoints?ft('Toplam puanda öndesin!','You lead on total points!'):ft('Arkadaşın toplam puanda önde.','Your friend leads on total points.')}</p>${partnerReady?`<p>${escapeMarkup(friendOpponent.name)}${coop?' · '+ft('Rol','Role')+' '+friendOpponent.role:': '+theirPoints+' '+ft('puan','points')}</p>`:''}${coop&&partnerReady?`<div class="team-results">${friendIds(friendRun.seed,'coop').map((id,i)=>{const p=coopPuzzle(id,friendRun.seed);return `<div class="solution"><strong>${i+1}. ${ft('ortak hedef','shared target')} · ${friendRun.scores[i].stars===3&&friendOpponent.scores[i].stars===3?'3 ★':'0 ★'}</strong><p>${ft('Senin kartın','Your card')}: ${friendRun.scores[i].guess+1} · ${ft('Arkadaşının kartı','Partner’s card')}: ${friendOpponent.scores[i].guess+1}</p>${memorySvg(p.cards[p.target])}<small>${ft('Doğru kart','Correct card')}: ${p.target+1} · ${coopFeature(p.a,p.cards[p.target][p.a])} + ${coopFeature(p.b,p.cards[p.target][p.b])}</small></div>`;}).join('')}</div>`:''}${!coop?`<table class="friend-table"><thead><tr><th>${ft('Soru','Question')}</th><th>${escapeMarkup(friendRun.name)}</th>${partnerReady?`<th>${escapeMarkup(friendOpponent.name)}</th>`:''}</tr></thead><tbody>${friendRun.scores.map((r,i)=>`<tr><td>${i+1}</td><td>${r.points>0?'+':''}${r.points}</td>${partnerReady?`<td>${friendOpponent.scores[i].points>0?'+':''}${friendOpponent.scores[i].points}</td>`:''}</tr>`).join('')}</tbody></table>`:''}${friendShareBox(true)}<button class="full" data-action="friends">${ft('Yeni meydan okuma','New challenge')}</button></section>${storageNote()}`;};
const freshBaseIcon=modeIcon;modeIcon=function(mode){const paths={detective:'M27 8a18 18 0 1 0 0 36a18 18 0 1 0 0-36M40 40l17 17M19 22h16m-16 8h10',market:'M10 23h44l-5 32H15zM20 23l12-15 12 15M25 35v10m14-10v10',confidence:'M32 6l21 9v18c0 12-21 24-21 24S11 45 11 33V15zM23 32l6 7 13-15',connections:'M18 10a8 8 0 1 0 0 16a8 8 0 1 0 0-16M47 34a8 8 0 1 0 0 16a8 8 0 1 0 0-16M18 26v16h21M25 18h22v16',coop:'M19 8a8 8 0 1 0 0 16a8 8 0 1 0 0-16M45 8a8 8 0 1 0 0 16a8 8 0 1 0 0-16M6 49V36q13-13 26 0q13-13 26 0v13M23 45l9 9 9-9'};return paths[mode]?`<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[mode]}"/></svg>`:freshBaseIcon(mode==='logic'?'classic':mode);};
const freshBaseAct=act;act=function(action,index,card,chosenLang){if(action==='newModeHome'){clearMemoryTimer();if(friendRun)saveFriends();friendRun=null;friendOpponent=null;freshActiveMode=card;renderFreshHome(card);return;}if(action==='freshDifficulty'){if(['easy','medium','hard'].includes(card))freshDifficulty=card;renderFreshHome('logic');return;}if(action==='freshStart'){startFresh(freshActiveMode);return;}if(action==='freshBack'){renderFreshHome(freshRun?.mode||freshActiveMode);return;}if(action==='freshReplayPool'){const ids=freshPool(freshActiveMode);freshSeen[freshActiveMode]=(freshSeen[freshActiveMode]||[]).filter(i=>!ids.includes(i));saveFresh();startFresh(freshActiveMode);return;}if(action==='freshInvite'||action==='freshCoopCreate'){const selectedMode=['freshHome','classicHome'].includes(screen)?freshActiveMode:freshRun?.mode||freshActiveMode;friendDraftDifficulty=action==='freshCoopCreate'?'coop':selectedMode==='logic'?'logic_'+freshDifficulty:selectedMode;freshBaseAct('friends');return;}if(action==='freshChoice'){if(!freshAnswered&&Number.isInteger(index)&&index>=0&&index<4){freshSelected=index;renderFreshGame();}return;}if(action==='freshExtra'){if(!freshAnswered&&freshAux.includes(index)){freshExtra=index;renderFreshGame();}return;}if(action==='freshConfidence'){if(!freshAnswered&&[1,2,3].includes(index)){freshConfidence=index;renderFreshGame();}return;}if(action==='freshHint'){if(!freshAnswered&&[0,1,2].includes(index)&&!freshHints.includes(index)){freshHints.push(index);renderFreshGame();}return;}if(action==='freshSubmit'){submitFresh();return;}if(action==='freshNext'){nextFresh();return;}if(action==='freshShareHint'){shareCoopHint();return;}freshBaseAct(action,index,card,chosenLang);};



const freshNavigationAct=act;act=function(...args){const previousScreen=screen;freshNavigationAct(...args);if(previousScreen!==screen||['freshStart','freshNext','freshReplayPool'].includes(args[0]))window.scrollTo?.({top:0,behavior:'instant'});};

redraw();
openChallenge();
</script></body></html>
